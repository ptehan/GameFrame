<script>
////////////////////////////////////////////////////////////
// VARS
////////////////////////////////////////////////////////////
const TEMP_ID     = "{{ temp_id }}";
const SID         = "{{ sid }}";
const TEAM_ID     = "{{ team_id }}";
const HITTER_ID   = "{{ hitter_id }}";
const DESCRIPTION = "{{ description }}";

let frames = [];
let fps = 30;

let startFrame    = 0;
let decisionFrame = 0;
let contactFrame  = 0;

let previewScale = 1.0;
const BASE_SIZE = 320;

const slider  = document.getElementById("frame_slider");
const canvas  = document.getElementById("preview");
const ctx     = canvas.getContext("2d");
const info    = document.getElementById("info");
const markerStatus = document.getElementById("marker_status");

let analysisFrames = null;
let graphReady = false;
let contactSeries = null;
let contactSmoothedSeries = null;
let decisionSeries = null;
let decisionDisplaySeries = null;
let startSeries = null;
let startKneeSeries = null;
let startHipSeries = null;
let startRawSeries = null;
let startRawKneeSeries = null;
let startRawHipSeries = null;
let startRawHeelYSeries = null;
let poseLandmarksFrames = null;
let manualSeedPoint = null;
let awaitingManualPick = false;
let lastBuildSeedPoint = null;
let leadSide = "left";
const GRAPH_W = 1000;
const GRAPH_H = 220;

let poseInstance = null;
let poseInitPromise = null;
let poseResolver = null;
const POSE_CONNECTIONS = [
    [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
    [11, 23], [12, 24], [23, 24], [23, 25], [25, 27],
    [24, 26], [26, 28], [27, 31], [28, 32], [27, 29], [28, 30],
];
const POSE_LANDMARK_NAMES = [
    "nose",
    "left_eye_inner", "left_eye", "left_eye_outer",
    "right_eye_inner", "right_eye", "right_eye_outer",
    "left_ear", "right_ear",
    "mouth_left", "mouth_right",
    "left_shoulder", "right_shoulder",
    "left_elbow", "right_elbow",
    "left_wrist", "right_wrist",
    "left_pinky", "right_pinky",
    "left_index", "right_index",
    "left_thumb", "right_thumb",
    "left_hip", "right_hip",
    "left_knee", "right_knee",
    "left_ankle", "right_ankle",
    "left_heel", "right_heel",
    "left_foot_index", "right_foot_index",
];

////////////////////////////////////////////////////////////
// PROGRESS
////////////////////////////////////////////////////////////
function showProgress() {
    document.getElementById("progress-container").style.display = "block";
}

function hideProgress() {
    document.getElementById("progress-container").style.display = "none";
}

function updateProgress(pct, msg = "") {
    document.getElementById("progress-bar").style.width = pct + "%";
    if (msg) document.getElementById("progress-label").innerText = msg;
}

function ensurePose() {
    if (poseInstance) return Promise.resolve(poseInstance);
    if (poseInitPromise) return poseInitPromise;
    if (typeof Pose === "undefined") return Promise.resolve(null);
    poseInitPromise = new Promise((resolve) => {
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
        });
        pose.setOptions({
            modelComplexity: 1,
            staticImageMode: true,
            smoothLandmarks: false,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
        });
        pose.onResults((results) => {
            if (poseResolver) {
                poseResolver(results.poseLandmarks || null);
                poseResolver = null;
            }
        });
        poseInstance = pose;
        resolve(pose);
    });
    return poseInitPromise;
}

async function resetPoseInstance() {
    if (!poseInstance) return;
    try {
        if (typeof poseInstance.close === "function") await poseInstance.close();
    } catch (e) {
        console.warn("Pose reset failed", e);
    }
    poseInstance = null;
    poseInitPromise = null;
    poseResolver = null;
}
function runPoseOnBitmap(bitmap) {
    return new Promise(async (resolve) => {
        const pose = await ensurePose();
        if (!pose) {
            resolve(null);
            return;
        }
        poseResolver = resolve;
        const off = new OffscreenCanvas(bitmap.width, bitmap.height);
        const offCtx = off.getContext("2d");
        offCtx.drawImage(bitmap, 0, 0);
        await pose.send({ image: off });
    });
}

function runPoseOnBitmapCrop(bitmap, crop) {
    return new Promise(async (resolve) => {
        const pose = await ensurePose();
        if (!pose) {
            resolve(null);
            return;
        }
        poseResolver = (lm) => {
            if (!lm) {
                resolve(null);
                return;
            }
            const mapped = lm.map((p) => ({
                ...p,
                x: crop.x + p.x * crop.w,
                y: crop.y + p.y * crop.h,
            }));
            resolve(mapped);
        };
        const off = new OffscreenCanvas(bitmap.width, bitmap.height);
        const offCtx = off.getContext("2d");
        const sx = Math.max(0, Math.floor(crop.x * bitmap.width));
        const sy = Math.max(0, Math.floor(crop.y * bitmap.height));
        const sw = Math.max(1, Math.floor(crop.w * bitmap.width));
        const sh = Math.max(1, Math.floor(crop.h * bitmap.height));
        offCtx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, bitmap.width, bitmap.height);
        await pose.send({ image: off });
    });
}

async function detectAllPoseCandidatesForFrame(bitmap) {
    const candidates = [];
    const full = await runPoseOnBitmap(bitmap);
    if (full) candidates.push(full);

    // MediaPipe Pose is single-person; run on multiple windows to detect everyone.
    const crops = [
        { x: 0.00, y: 0.00, w: 0.55, h: 0.72 },
        { x: 0.45, y: 0.00, w: 0.55, h: 0.72 },
        { x: 0.00, y: 0.18, w: 0.55, h: 0.82 },
        { x: 0.45, y: 0.18, w: 0.55, h: 0.82 },
        { x: 0.22, y: 0.00, w: 0.56, h: 0.78 },
    ];
    for (const crop of crops) {
        const lm = await runPoseOnBitmapCrop(bitmap, crop);
        if (lm) candidates.push(lm);
    }

    // Deduplicate by shoulder center.
    const out = [];
    for (const lm of candidates) {
        const ls = lm && lm[11];
        const rs = lm && lm[12];
        if (!ls || !rs) continue;
        const cx = (ls.x + rs.x) * 0.5;
        const cy = (ls.y + rs.y) * 0.5;
        let isDup = false;
        for (const d of out) {
            const dx = cx - d.cx;
            const dy = cy - d.cy;
            if (Math.hypot(dx, dy) < 0.06) {
                isDup = true;
                break;
            }
        }
        if (!isDup) out.push({ lm, cx, cy });
    }
    return out.map((v) => v.lm);
}

function rearShoulderSetupScore(lm) {
    if (!lm) return -Infinity;
    const ls = lm[11], rs = lm[12], lw = lm[15], rw = lm[16];
    if (!ls || !rs || !lw || !rw) return -Infinity;

    const wristMidX = (lw.x + rw.x) * 0.5;
    const wristMidY = (lw.y + rw.y) * 0.5;
    const handsTogether = Math.hypot(lw.x - rw.x, lw.y - rw.y);
    const nearLeftShoulder = Math.hypot(wristMidX - ls.x, wristMidY - ls.y);
    const nearRightShoulder = Math.hypot(wristMidX - rs.x, wristMidY - rs.y);
    const nearRearShoulder = Math.min(nearLeftShoulder, nearRightShoulder);
    return -(handsTogether * 5.0 + nearRearShoulder * 6.0);
}

function rearShoulderMetrics(lm) {
    if (!lm) return null;
    const ls = lm[11], rs = lm[12], lw = lm[15], rw = lm[16], lh = lm[23], rh = lm[24];
    if (!ls || !rs || !lw || !rw || !lh || !rh) return null;
    const wristMidX = (lw.x + rw.x) * 0.5;
    const wristMidY = (lw.y + rw.y) * 0.5;
    const shoulderMidX = (ls.x + rs.x) * 0.5;
    const shoulderMidY = (ls.y + rs.y) * 0.5;
    const hipMidY = (lh.y + rh.y) * 0.5;
    const handsTogether = Math.hypot(lw.x - rw.x, lw.y - rw.y);
    const nearLeftShoulder = Math.hypot(wristMidX - ls.x, wristMidY - ls.y);
    const nearRightShoulder = Math.hypot(wristMidX - rs.x, wristMidY - rs.y);
    const nearRearShoulder = Math.min(nearLeftShoulder, nearRightShoulder);
    const sideOffset = Math.abs(wristMidX - shoulderMidX);
    return {
        handsTogether,
        nearRearShoulder,
        wristMidY,
        shoulderMidY,
        hipMidY,
        sideOffset,
    };
}

function centerOfPerson(lm) {
    const ls = lm && lm[11];
    const rs = lm && lm[12];
    if (!ls || !rs) return null;
    return { x: (ls.x + rs.x) * 0.5, y: (ls.y + rs.y) * 0.5 };
}

function hipCenter(lm) {
    if (!lm) return null;
    const lh = lm[23], rh = lm[24];
    if (!lh && !rh) return null;
    let x = 0, y = 0, count = 0;
    if (lh) { x += lh.x; y += lh.y; count += 1; }
    if (rh) { x += rh.x; y += rh.y; count += 1; }
    return { x: x / count, y: y / count };
}

function buildPersonTracks(candidatesByFrame) {
    const tracks = [];
    const maxLinkDist = 0.12;
    for (let fi = 0; fi < candidatesByFrame.length; fi += 1) {
        const candidates = candidatesByFrame[fi] || [];
        const usedTrackIdx = new Set();
        for (const lm of candidates) {
            const c = hipCenter(lm) || centerOfPerson(lm);
            if (!c) continue;
            let best = null;
            let bestIdx = -1;
            let bestDist = Infinity;
            for (let ti = 0; ti < tracks.length; ti += 1) {
                if (usedTrackIdx.has(ti)) continue;
                const t = tracks[ti];
                if (fi - t.lastFrame > 3) continue;
                const d = Math.hypot(c.x - t.lastCenter.x, c.y - t.lastCenter.y);
                if (d < maxLinkDist && d < bestDist) {
                    bestDist = d;
                    best = t;
                    bestIdx = ti;
                }
            }
            if (!best) {
                best = {
                    frames: new Array(candidatesByFrame.length).fill(null),
                    lastFrame: fi,
                    lastCenter: c,
                };
                tracks.push(best);
                bestIdx = tracks.length - 1;
            }
            best.frames[fi] = lm;
            best.lastFrame = fi;
            best.lastCenter = c;
            usedTrackIdx.add(bestIdx);
        }
    }
    return tracks;
}

function chooseBatterTrack(tracks, frameCount) {
    // Use only early setup frames; batter should show hands-together near shoulder here.
    const earlyEnd = Math.max(8, Math.min(frameCount - 1, Math.floor(frameCount * 0.35)));
    let bestTrack = null;
    let bestScore = -Infinity;
    for (const t of tracks) {
        let setupCount = 0;
        let strictSetupCount = 0;
        let centerYSum = 0;
        let centerYCount = 0;
        let bestFrameError = Infinity;
        let bestFrameShoulderDist = Infinity;
        let bestFrameHands = Infinity;
        let bestFrameSideOffset = 0;

        for (let i = 0; i < earlyEnd; i += 1) {
            const m = rearShoulderMetrics(t.frames[i]);
            if (!m) continue;

            const isSetup =
                m.handsTogether <= 0.34 &&
                m.nearRearShoulder <= 0.30 &&
                m.wristMidY <= (m.hipMidY - 0.02) &&
                m.sideOffset >= 0.02;

            const isStrictSetup =
                m.handsTogether <= 0.24 &&
                m.nearRearShoulder <= 0.20 &&
                m.wristMidY <= (m.shoulderMidY + 0.12) &&
                m.wristMidY <= (m.hipMidY - 0.06) &&
                m.sideOffset >= 0.04;

            const c = centerOfPerson(t.frames[i]);
            if (c) {
                centerYSum += c.y;
                centerYCount += 1;
            }
            const lowHandsPenalty = Math.max(0, m.wristMidY - (m.shoulderMidY + 0.14));
            const weakSidePenalty = Math.max(0, 0.05 - m.sideOffset);
            const frameError =
                m.handsTogether * 2.6 +
                m.nearRearShoulder * 3.8 +
                lowHandsPenalty * 2.2 +
                weakSidePenalty * 2.0;

            if (frameError < bestFrameError) {
                bestFrameError = frameError;
                bestFrameShoulderDist = m.nearRearShoulder;
                bestFrameHands = m.handsTogether;
                bestFrameSideOffset = m.sideOffset;
            }

            if (isSetup) setupCount += 1;
            if (isStrictSetup) strictSetupCount += 1;
        }

        // No readable setup evidence in early frames.
        if (!Number.isFinite(bestFrameError)) continue;

        const avgCenterY = centerYCount ? (centerYSum / centerYCount) : 0;
        if (avgCenterY < 0.45) continue; // keep pitcher/fielders out

        const setupRatio = setupCount / Math.max(1, earlyEnd);
        const strictRatio = strictSetupCount / Math.max(1, earlyEnd);
        const score =
            (-bestFrameError * 14.0) +
            (setupRatio * 12.0) +
            (strictRatio * 10.0) +
            (avgCenterY * 3.0) +
            ((0.36 - bestFrameShoulderDist) * 3.0) +
            ((0.40 - bestFrameHands) * 2.0) +
            (bestFrameSideOffset * 2.0);

        if (score > bestScore) {
            bestScore = score;
            bestTrack = t;
        }
    }
    return bestTrack;
}

function batterCandidateScore(lm) {
    const m = rearShoulderMetrics(lm);
    const c = centerOfPerson(lm);
    if (!m || !c) return -Infinity;
    const lowHandsPenalty = Math.max(0, m.wristMidY - (m.shoulderMidY + 0.16));
    const weakSidePenalty = Math.max(0, 0.05 - m.sideOffset);
    let score =
        -(m.handsTogether * 3.0 + m.nearRearShoulder * 4.2 + lowHandsPenalty * 2.2 + weakSidePenalty * 1.6);
    if (c.y < 0.45) score -= 0.8; // pitcher/fielders are usually higher in frame
    return score;
}

function personSignature(lm) {
    if (!lm) return null;
    const ls = lm[11], rs = lm[12], lh = lm[23], rh = lm[24], la = lm[27], ra = lm[28];
    if (!ls || !rs || !lh || !rh) return null;
    const shoulderW = Math.hypot(ls.x - rs.x, ls.y - rs.y);
    const hipW = Math.hypot(lh.x - rh.x, lh.y - rh.y);
    const shoulderMid = { x: (ls.x + rs.x) * 0.5, y: (ls.y + rs.y) * 0.5 };
    const hipMid = { x: (lh.x + rh.x) * 0.5, y: (lh.y + rh.y) * 0.5 };
    const torsoH = Math.hypot(shoulderMid.x - hipMid.x, shoulderMid.y - hipMid.y);
    let ankleY = null;
    if (la && ra) ankleY = (la.y + ra.y) * 0.5;
    else if (la) ankleY = la.y;
    else if (ra) ankleY = ra.y;
    const fullH = ankleY != null ? Math.max(0.001, ankleY - shoulderMid.y) : torsoH * 1.8;
    return { shoulderW, hipW, torsoH, fullH };
}

function signatureDistance(sigA, sigB) {
    if (!sigA || !sigB) return 999;
    const rel = (a, b) => Math.abs(a - b) / Math.max(1e-6, (a + b) * 0.5);
    return (
        rel(sigA.shoulderW, sigB.shoulderW) * 0.45 +
        rel(sigA.hipW, sigB.hipW) * 0.25 +
        rel(sigA.torsoH, sigB.torsoH) * 0.20 +
        rel(sigA.fullH, sigB.fullH) * 0.10
    );
}

function chooseBatterLandmarks(candidatesByFrame, frameCount, manualSeed = null) {
    const n = candidatesByFrame.length;
    if (!n) return null;
    const earlyEnd = Math.max(8, Math.min(frameCount - 1, Math.floor(frameCount * 0.35)));

    let seedFrame = -1;
    let seedLm = null;
    let seedScore = -Infinity;

    if (manualSeed && Number.isFinite(manualSeed.frame) && manualSeed.frame >= 0 && manualSeed.frame < n) {
        const ms = candidatesByFrame[manualSeed.frame] || [];
        let bestD = Infinity;
        for (const lm of ms) {
            const c = centerOfPerson(lm);
            if (!c) continue;
            const d = Math.hypot(c.x - manualSeed.x, c.y - manualSeed.y);
            if (d < bestD) {
                bestD = d;
                seedLm = lm;
            }
        }
        if (seedLm && bestD <= 0.28) {
            seedFrame = manualSeed.frame;
            seedScore = batterCandidateScore(seedLm);
        } else {
            seedLm = null;
        }
    }

    for (let i = 0; i < earlyEnd; i += 1) {
        const candidates = candidatesByFrame[i] || [];
        for (const lm of candidates) {
            const s = batterCandidateScore(lm);
            if (s > seedScore) {
                seedScore = s;
                seedFrame = i;
                seedLm = lm;
            }
        }
    }
    if (!seedLm) return null;

    const chosen = new Array(n).fill(null);
    chosen[seedFrame] = seedLm;
    const seedCenter = centerOfPerson(seedLm);
    const seedSig = personSignature(seedLm);
    const seedSide = seedCenter && seedCenter.x < 0.5 ? "left" : "right";

    const chooseNear = (frameIdx, prevCenter) => {
        const candidates = candidatesByFrame[frameIdx] || [];
        if (!candidates.length) return null;
        let bestLm = null;
        let bestObj = -Infinity;
        for (const lm of candidates) {
            const c = centerOfPerson(lm);
            if (!c) continue;
            const s = batterCandidateScore(lm);
            const d = prevCenter ? Math.hypot(c.x - prevCenter.x, c.y - prevCenter.y) : 0;
            const fromSeed = seedCenter ? Math.abs(c.x - seedCenter.x) : 0;
            const sigD = signatureDistance(personSignature(lm), seedSig);
            // Hard anti-switch guards: do not jump from batter to ump/pitcher.
            if (prevCenter && d > 0.12) continue;
            if (seedCenter && fromSeed > 0.11) continue;
            if (seedCenter && seedSide === "left" && c.x > seedCenter.x + 0.10) continue;
            if (seedCenter && seedSide === "right" && c.x < seedCenter.x - 0.10) continue;
            if (sigD > 0.45) continue;

            const continuityPenalty = prevCenter ? d * 9.0 : 0;
            const seedPenalty = seedCenter ? fromSeed * 7.0 : 0;
            const sigPenalty = sigD * 8.0;
            const obj = s * 1.5 - continuityPenalty - seedPenalty - sigPenalty;
            if (obj > bestObj) {
                bestObj = obj;
                bestLm = lm;
            }
        }
        return bestLm;
    };

    let prevCenter = centerOfPerson(seedLm);
    let holdLm = seedLm;
    let misses = 0;
    for (let i = seedFrame + 1; i < n; i += 1) {
        const lm = chooseNear(i, prevCenter);
        if (lm) {
            chosen[i] = lm;
            holdLm = lm;
            misses = 0;
            prevCenter = centerOfPerson(lm) || prevCenter;
        } else if (holdLm && misses < 2) {
            // Hold last confident subject briefly; never jump subjects on weak evidence.
            chosen[i] = holdLm;
            misses += 1;
        } else {
            chosen[i] = null;
            misses += 1;
        }
    }

    prevCenter = centerOfPerson(seedLm);
    holdLm = seedLm;
    misses = 0;
    for (let i = seedFrame - 1; i >= 0; i -= 1) {
        const lm = chooseNear(i, prevCenter);
        if (lm) {
            chosen[i] = lm;
            holdLm = lm;
            misses = 0;
            prevCenter = centerOfPerson(lm) || prevCenter;
        } else if (holdLm && misses < 2) {
            chosen[i] = holdLm;
            misses += 1;
        } else {
            chosen[i] = null;
            misses += 1;
        }
    }

    return chosen;
}

async function trackBatterFromManualSeed(manualSeed) {
    if (!manualSeed || !Number.isFinite(manualSeed.frame)) return null;
    const n = frames.length;
    if (!n || manualSeed.frame < 0 || manualSeed.frame >= n) return null;

    const seedCandidates = await detectAllPoseCandidatesForFrame(frames[manualSeed.frame]);
    let seedLm = null;
    let seedDist = Infinity;
    for (const lm of seedCandidates) {
        const h = hipCenter(lm);
        if (!h) continue;
        const d = Math.hypot(h.x - manualSeed.x, h.y - manualSeed.y);
        if (d < seedDist) {
            seedDist = d;
            seedLm = lm;
        }
    }
    if (!seedLm || seedDist > 0.30) return null;

    const chosen = new Array(n).fill(null);
    chosen[manualSeed.frame] = seedLm;

    const seedHip = hipCenter(seedLm);
    if (!seedHip) return null;
    const seedSide = seedHip.x < 0.5 ? "left" : "right";

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const detectNearHip = async (bitmap, targetHip) => {
        const windows = [
            { w: 0.34, h: 0.52, maxD: 0.09 },
            { w: 0.46, h: 0.68, maxD: 0.13 },
            { w: 0.62, h: 0.86, maxD: 0.18 },
        ];
        for (const win of windows) {
            const crop = {
                x: clamp01(targetHip.x - win.w * 0.5),
                y: clamp01(targetHip.y - win.h * 0.52),
                w: win.w,
                h: win.h,
            };
            crop.x = Math.min(crop.x, 1 - crop.w);
            crop.y = Math.min(crop.y, 1 - crop.h);
            const lm = await runPoseOnBitmapCrop(bitmap, crop);
            const h = hipCenter(lm);
            if (!h) continue;
            const d = Math.hypot(h.x - targetHip.x, h.y - targetHip.y);
            if (d > win.maxD) continue;
            if (seedSide === "left" && h.x > seedHip.x + 0.20) continue;
            if (seedSide === "right" && h.x < seedHip.x - 0.20) continue;
            if (Math.hypot(h.x - seedHip.x, h.y - seedHip.y) > 0.32) continue;
            return lm;
        }

        // Fallback: full-frame candidates, still tightly gated to current hip.
        const fullCandidates = await detectAllPoseCandidatesForFrame(bitmap);
        let best = null;
        let bestD = Infinity;
        for (const lm of fullCandidates) {
            const h = hipCenter(lm);
            if (!h) continue;
            if (seedSide === "left" && h.x > seedHip.x + 0.20) continue;
            if (seedSide === "right" && h.x < seedHip.x - 0.20) continue;
            const dCurr = Math.hypot(h.x - targetHip.x, h.y - targetHip.y);
            const dSeed = Math.hypot(h.x - seedHip.x, h.y - seedHip.y);
            if (dCurr > 0.20 || dSeed > 0.32) continue;
            if (dCurr < bestD) {
                bestD = dCurr;
                best = lm;
            }
        }
        return best;
    };

    let prevHip = seedHip;
    let misses = 0;
    for (let i = manualSeed.frame + 1; i < n; i += 1) {
        const lm = await detectNearHip(frames[i], prevHip);
        if (!lm) {
            chosen[i] = null;
            misses += 1;
            if (misses >= 4) break;
            continue;
        }
        chosen[i] = lm;
        prevHip = hipCenter(lm) || prevHip;
        misses = 0;
    }

    prevHip = seedHip;
    misses = 0;
    for (let i = manualSeed.frame - 1; i >= 0; i -= 1) {
        const lm = await detectNearHip(frames[i], prevHip);
        if (!lm) {
            chosen[i] = null;
            misses += 1;
            if (misses >= 4) break;
            continue;
        }
        chosen[i] = lm;
        prevHip = hipCenter(lm) || prevHip;
        misses = 0;
    }

    return chosen;
}

async function loadVideo() {
    showProgress();
    updateProgress(5, "Fetching videoâ€¦");

    const resp = await fetch(`/raw/swing?id=${TEMP_ID}`);
    const buf  = await resp.arrayBuffer();

    updateProgress(20, "Preparing videoâ€¦");

    const blob = new Blob([buf], { type: "video/mp4" });
    const video = document.createElement("video");
    video.src = URL.createObjectURL(blob);
    video.muted = true;
    video.playsInline = true;

    await video.play().catch(() => {});
    updateProgress(35, "Initializing decoderâ€¦");

    const stream = video.captureStream();
    const track  = stream.getVideoTracks()[0];
    if (!track) {
        info.textContent = "Cannot decode this MP4.";
        return;
    }

    const processor = new MediaStreamTrackProcessor(track);
    const reader    = processor.readable.getReader();

    frames = [];
    updateProgress(40, "Decoding framesâ€¦");

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const bmp = await createImageBitmap(value);
        frames.push(bmp);
        value.close();

        if (frames.length % 20 === 0) {
            updateProgress(
                Math.min(40 + (frames.length / 5000) * 40, 80),
                `Decodingâ€¦ ${frames.length} frames`
            );
        }
    }

    updateProgress(90, "Building previewâ€¦");

    slider.max = frames.length - 1;
    drawFrame(0);

    updateProgress(100, "Done!");
    hideProgress();

    info.textContent = `Frames: ${frames.length} | FPS approx: ${fps}`;
}

function drawFrame(i) {
    const f = frames[i];
    if (!f) return;

    const size = Math.round(BASE_SIZE * previewScale);

    canvas.width  = size;
    canvas.height = size;

    const scale = Math.min(size / f.width, size / f.height);
    const w = Math.round(f.width * scale);
    const h = Math.round(f.height * scale);

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, size, size);

    const drawX = Math.round((size - w) / 2);
    const drawY = Math.round((size - h) / 2);
    ctx.drawImage(
        f,
        drawX,
        drawY,
        w, h
    );

    // MediaPipe pose overlay (if charts were built)
    const lm = poseLandmarksFrames && poseLandmarksFrames[i];
    if (lm && lm.length) {
        const toCanvas = (p) => ({
            x: drawX + p.x * w,
            y: drawY + p.y * h,
            v: Number.isFinite(p.visibility) ? p.visibility : 1,
        });

        const leftHip = lm[23];
        const rightHip = lm[24];
        if (leftHip) {
            const c = toCanvas(leftHip);
            if (c.v >= 0.35) {
                ctx.beginPath();
                ctx.fillStyle = "#ff4d4d";
                ctx.arc(c.x, c.y, 4.0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        if (rightHip) {
            const c = toCanvas(rightHip);
            if (c.v >= 0.35) {
                ctx.beginPath();
                ctx.fillStyle = "#33ff66";
                ctx.arc(c.x, c.y, 4.0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // Preview HUD: selected frame + marker frames
    const lines = [
        `Frame: ${i} / ${Math.max(0, frames.length - 1)}`,
        `Start: ${startFrame}`,
        `Decision: ${decisionFrame}`,
        `Contact: ${contactFrame}`,
    ];
    const boxX = 8;
    const boxY = 8;
    const lineH = 16;
    const boxW = 210;
    const boxH = 10 + lines.length * lineH;
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.font = "12px monospace";
    for (let li = 0; li < lines.length; li += 1) {
        const textY = boxY + 14 + li * lineH;
        if (li === 1) ctx.fillStyle = i === startFrame ? "#00ffff" : "#9adfff";
        else if (li === 2) ctx.fillStyle = i === decisionFrame ? "#33ff66" : "#aaff99";
        else if (li === 3) ctx.fillStyle = i === contactFrame ? "#66aaff" : "#aaccff";
        else ctx.fillStyle = "#ffffff";
        ctx.fillText(lines[li], boxX + 8, textY);
    }

    if (graphReady) updateGraphLine(i);
}

function bitmapToGrayVector(bitmap, size = 64) {
    const off = new OffscreenCanvas(size, size);
    const offCtx = off.getContext("2d", { willReadFrequently: true });
    offCtx.drawImage(bitmap, 0, 0, size, size);
    const img = offCtx.getImageData(0, 0, size, size).data;
    const gray = new Uint8Array(size * size);
    for (let i = 0, j = 0; i < img.length; i += 4, j += 1) {
        gray[j] = (img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114) | 0;
    }
    return gray;
}

function regionMotion(prev, curr, size, y0, y1) {
    let sum = 0;
    for (let y = y0; y < y1; y += 1) {
        const row = y * size;
        for (let x = 0; x < size; x += 1) {
            const idx = row + x;
            sum += Math.abs(curr[idx] - prev[idx]);
        }
    }
    return sum;
}

async function ensureAnalysisFrames() {
    if (analysisFrames) return analysisFrames;
    const size = 64;
    const gray = [];
    for (const f of frames) gray.push(bitmapToGrayVector(f, size));
    analysisFrames = { size, gray };
    return analysisFrames;
}

function smoothSeries(series, radius = 2) {
    if (!series || !series.length) return [];
    const out = new Array(series.length).fill(null);
    for (let i = 0; i < series.length; i += 1) {
        let sum = 0;
        let cnt = 0;
        for (let k = -radius; k <= radius; k += 1) {
            const j = i + k;
            if (j < 0 || j >= series.length) continue;
            const v = series[j];
            if (!Number.isFinite(v)) continue;
            sum += v;
            cnt += 1;
        }
        if (cnt >= 2) out[i] = sum / cnt;
    }
    return out;
}

function landmarkVisible(p, minV = 0.45) {
    if (!p) return false;
    const v = Number.isFinite(p.visibility) ? p.visibility : 1;
    return v >= minV;
}

function shoulderWidth(lm) {
    if (!lm || !lm[11] || !lm[12]) return null;
    return Math.hypot(lm[11].x - lm[12].x, lm[11].y - lm[12].y);
}

// Display-only hand-speed series (does not affect decision detection).
function buildDecisionDisplaySeries(landmarks) {
    if (!landmarks || !landmarks.length) return [];
    const n = landmarks.length;
    const out = new Array(n).fill(null);
    for (let i = 1; i < n; i += 1) {
        const prev = landmarks[i - 1];
        const curr = landmarks[i];
        if (!prev || !curr) continue;

        const sw0 = shoulderWidth(prev);
        const sw1 = shoulderWidth(curr);
        const norm = Math.max(0.05, Number.isFinite(sw0) && Number.isFinite(sw1) ? (sw0 + sw1) * 0.5 : 0.05);

        let speed = 0;
        const wrists = [15, 16];
        for (const wi of wrists) {
            const p0 = prev[wi];
            const p1 = curr[wi];
            if (!landmarkVisible(p0) || !landmarkVisible(p1)) continue;
            const d = Math.hypot(p1.x - p0.x, p1.y - p0.y) / norm;
            if (d > speed) speed = d;
        }
        if (speed > 0) out[i] = speed;
    }
    return smoothSeries(out, 1);
}

function drawSeriesChart(canvasId, title, series, markerIdx, selectedIdx, extraMarkers = []) {
    const c = document.getElementById(canvasId);
    if (!c || !series || !series.length) return;
    const g = c.getContext("2d");
    const W = c.width, H = c.height;
    const padL = 36, padR = 16, padT = 24, padB = 22;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = Math.max(frames.length, series.length, 1);
    const xScale = plotW / Math.max(1, n - 1);
    const vals = series.filter((v) => Number.isFinite(v));
    if (!vals.length) return;
    let minV = Math.min(...vals), maxV = Math.max(...vals);
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const yScale = plotH / (maxV - minV);

    g.fillStyle = "#111"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#444";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(padL, padT);
    g.lineTo(padL, H - padB);
    g.lineTo(W - padR, H - padB);
    g.stroke();

    g.strokeStyle = "#56a7ff"; g.lineWidth = 2; g.beginPath();
    let started = false;
    for (let i = 0; i < series.length; i += 1) {
        const v = series[i];
        if (!Number.isFinite(v)) continue;
        const x = padL + i * xScale;
        const y = padT + (maxV - v) * yScale;
        if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
    }
    g.stroke();

    const drawMarker = (idx, color, width) => {
        if (!Number.isFinite(idx)) return;
        const x = padL + idx * xScale;
        g.strokeStyle = color; g.lineWidth = width; g.beginPath();
        g.moveTo(x, padT); g.lineTo(x, H - padB); g.stroke();
    };
    for (const m of extraMarkers) {
        if (!m) continue;
        drawMarker(m.idx, m.color || "#ffaa00", m.width || 2);
    }
    drawMarker(markerIdx, "#33ff88", 3);
    drawMarker(selectedIdx, "#ffffff", 1);

    // Axis labels and ticks
    g.fillStyle = "#8f8f8f";
    g.font = "11px monospace";
    g.fillText("Value", 4, padT + 4);
    g.fillText("Frame", W - 54, H - 6);
    const tickEvery = n > 120 ? 20 : 10;
    g.textAlign = "center";
    for (let ti = 0; ti < n; ti += tickEvery) {
        const tx = padL + ti * xScale;
        g.strokeStyle = "#333";
        g.beginPath();
        g.moveTo(tx, H - padB);
        g.lineTo(tx, H - padB + 4);
        g.stroke();
        g.fillText(String(ti), tx, H - 6);
    }
    g.textAlign = "left";
    g.fillText(maxV.toFixed(2), 2, padT + 2);
    g.fillText(minV.toFixed(2), 2, H - padB - 2);

    g.fillStyle = "#bbb"; g.font = "12px monospace";
    g.fillText(title, 8, 16);
}

////////////////////////////////////////////////////////////
// MARKER DETECTION RULES (DOCUMENTATION)
////////////////////////////////////////////////////////////
// Contact rule set:
// 1) Use RAW hip-distance series (blue), not smoothed, for selection.
// 2) Ignore early setup jitter via a warmup window.
// 3) Candidate contact must be a local peak.
// 4) Prefer the FIRST peak that is:
//    - at least 65% of the max local peak, and
//    - has sufficient incoming acceleration.
// 5) If no "fast" peak clears threshold, use first >=65% peak.
// 6) If no peak clears threshold, use strongest remaining raw peak.
// 7) Hard gate: contact cannot occur before hand-speed onset
//    (implemented as minContactIdx = decisionOnset + 1).
//
// Decision rule set:
// 1) Default decision is 5 frames before contact.
// 2) Allow slower swings up to 7 before contact, and fast swings up to 4 before contact.
// 3) Start from 5-before and adjust within [contact-7, contact-4] using local hand-speed shape.
//
// Start rule set:
// 1) Prefer first sustained lead-heel lift onset.
// 2) Fallback to first sustained forward move of lead knee/hip.
// 3) Keep start before decision/contact window.
function detectContactFrameFromHipSeries(series, selectedIdx, minContactIdx = 0) {
    if (!series || !series.length) return null;
    const n = series.length;
    const anchor = Math.max(0, Math.min(n - 1, Number.isFinite(selectedIdx) ? selectedIdx : 0));
    const floorIdx = Math.max(0, Math.min(n - 1, Number.isFinite(minContactIdx) ? Math.round(minContactIdx) : 0));

    const raw = series.map((v) => (Number.isFinite(v) ? v : null));
    const vals = raw.filter((v) => Number.isFinite(v));
    if (!vals.length) return anchor;

    const minV = Math.min(...vals);
    const maxV = Math.max(...vals);
    const range = Math.max(1e-6, maxV - minV);

    const deriv = new Array(n).fill(0);
    for (let i = 1; i < n; i += 1) {
        if (Number.isFinite(raw[i]) && Number.isFinite(raw[i - 1])) {
            deriv[i] = raw[i] - raw[i - 1];
        }
    }

    const posDer = deriv.filter((v) => Number.isFinite(v) && v > 0).sort((a, b) => a - b);
    const q = (arr, p) => {
        if (!arr.length) return 0;
        const idx = Math.max(0, Math.min(arr.length - 1, Math.floor((arr.length - 1) * p)));
        return arr[idx];
    };

    // Ignore early setup jitter.
    const warmup = Math.max(6, Math.min(14, Math.floor(n * 0.15)));
    const scanStart = Math.max(2, warmup, floorIdx);

    const minRiseVel = Math.max(q(posDer, 0.70), range * 0.025);
    const minRise = range * 0.18;
    const minDrop = range * 0.06;
    const minLevel = minV + range * 0.45;

    const snapForwardRawPeak = (baseIdx, maxAhead = 0) => {
        const b = Math.max(0, Math.min(n - 1, baseIdx));
        const e = Math.max(b, Math.min(n - 1, b + maxAhead));
        let out = b;
        let outVal = Number.isFinite(series[b]) ? series[b] : -Infinity;
        for (let i = b + 1; i <= e; i += 1) {
            const v = series[i];
            if (!Number.isFinite(v)) continue;
            if (v > outVal) {
                outVal = v;
                out = i;
            }
        }
        return out;
    };

    const peaks = [];
    for (let i = scanStart; i <= n - 3; i += 1) {
        const a = raw[i - 1], b = raw[i], c = raw[i + 1];
        if (![a, b, c].every(Number.isFinite)) continue;
        if (!(b >= a && b > c)) continue;

        let preMin = Infinity;
        for (let j = Math.max(0, i - 10); j < i; j += 1) {
            const v = raw[j];
            if (Number.isFinite(v)) preMin = Math.min(preMin, v);
        }
        if (!Number.isFinite(preMin)) continue;

        let postMin = b;
        for (let j = i + 1; j <= Math.min(n - 1, i + 6); j += 1) {
            const v = raw[j];
            if (Number.isFinite(v)) postMin = Math.min(postMin, v);
        }

        let inVel = 0;
        for (let j = Math.max(1, i - 5); j <= i; j += 1) {
            inVel = Math.max(inVel, deriv[j]);
        }

        const rise = b - preMin;
        const drop = b - postMin;
        const major = b >= minLevel && rise >= minRise && drop >= minDrop && inVel >= minRiseVel;
        peaks.push({ i, val: b, rise, drop, inVel, major });
    }
    const maxPeakVal = peaks.length ? Math.max(...peaks.map((p) => p.val)) : -Infinity;
    const minComparablePeakVal = Number.isFinite(maxPeakVal) ? (maxPeakVal * 0.65) : -Infinity;

    // Primary rule (strict): first local peak with fast acceleration
    // whose height is at least 65% of the highest local peak.
    const firstBigFast = peaks.find((p) =>
        p.val >= minComparablePeakVal &&
        p.inVel >= minRiseVel
    );
    if (firstBigFast) return snapForwardRawPeak(firstBigFast.i);

    // Secondary (still threshold-bound): first >=65% peak, even if acceleration is weak.
    const firstBig = peaks.find((p) => p.val >= minComparablePeakVal);
    if (firstBig) return snapForwardRawPeak(firstBig.i);

    // Fallback: strongest peak only when no peak clears the threshold.
    if (peaks.length) {
        let best = peaks[0];
        for (const p of peaks) {
            if (p.val > best.val) best = p;
        }
        return snapForwardRawPeak(best.i);
    }

    // Last resort: maximum raw point after warmup.
    let bestIdx = Math.max(warmup, floorIdx);
    let bestVal = -Infinity;
    for (let i = Math.max(warmup, floorIdx); i < n; i += 1) {
        const v = raw[i];
        if (!Number.isFinite(v)) continue;
        if (v > bestVal) {
            bestVal = v;
            bestIdx = i;
        }
    }
    if (Number.isFinite(bestVal)) return snapForwardRawPeak(bestIdx);

    return Math.max(anchor, floorIdx);
}

function detectHandOnsetForContactGate(series, fallbackIdx = 0) {
    if (!series || !series.length) return 0;
    const n = series.length;
    const clamp = (v) => Math.max(0, Math.min(n - 1, v));
    const smoothed = smoothSeries(series, 1);

    const warmup = Math.max(2, Math.min(10, Math.floor(n * 0.10)));
    const start = warmup + 1;
    const end = n - 1;

    const baseVals = [];
    for (let i = warmup; i <= Math.min(end, warmup + 8); i += 1) {
        const v = smoothed[i];
        if (Number.isFinite(v)) baseVals.push(v);
    }
    const baseline = baseVals.length ? (baseVals.reduce((a, b) => a + b, 0) / baseVals.length) : 0;

    let peakIdx = -1;
    let peakVal = -Infinity;
    for (let i = start; i <= end; i += 1) {
        const v = smoothed[i];
        if (!Number.isFinite(v)) continue;
        if (v > peakVal) {
            peakVal = v;
            peakIdx = i;
        }
    }
    if (peakIdx >= 0 && Number.isFinite(peakVal)) {
        const rise = Math.max(0, peakVal - baseline);
        const onsetLevel = baseline + rise * 0.28;
        const minRiseStep = Math.max(0.0008, rise * 0.03);
        for (let i = Math.max(start, 1); i <= peakIdx; i += 1) {
            const v0 = smoothed[i - 1];
            const v1 = smoothed[i];
            const v2 = smoothed[Math.min(end, i + 1)];
            if (![v0, v1, v2].every(Number.isFinite)) continue;
            const crossesOnset = v1 >= onsetLevel;
            const risingNow = (v1 - v0) >= minRiseStep;
            const sustained = v2 >= v1 * 0.90;
            if (crossesOnset && risingNow && sustained) return clamp(i);
        }
    }

    return clamp(Number.isFinite(fallbackIdx) ? Math.round(fallbackIdx) : warmup);
}

function detectDecisionFrameFromHandSeries(series, contactIdx, fallbackIdx = 0) {
    if (!series || !series.length) return 0;
    const n = series.length;
    const clamp = (v) => Math.max(0, Math.min(n - 1, v));
    const smoothed = smoothSeries(series, 1);

    if (!Number.isFinite(contactIdx)) {
        return clamp(Number.isFinite(fallbackIdx) ? Math.round(fallbackIdx) : 0);
    }

    const contact = clamp(Math.round(contactIdx));
    // Decision defaults to 5 before contact, with bounded adjustment.
    const defaultDecision = clamp(contact - 5);
    const slowBound = clamp(contact - 7);
    const fastBound = clamp(contact - 4);

    let winStart = Math.min(slowBound, fastBound);
    let winEnd = Math.max(slowBound, fastBound);
    winEnd = Math.min(winEnd, contact - 1);
    winStart = Math.max(1, Math.min(winStart, winEnd));

    const baseVals = [];
    const baseStart = Math.max(1, winStart - 6);
    const baseEnd = Math.max(baseStart, winStart - 2);
    for (let i = baseStart; i <= baseEnd; i += 1) {
        const v = smoothed[i];
        if (Number.isFinite(v)) baseVals.push(v);
    }
    const baseline = baseVals.length ? (baseVals.reduce((a, b) => a + b, 0) / baseVals.length) : 0;

    let bestIdx = defaultDecision;
    let bestScore = -Infinity;
    for (let i = winStart; i <= winEnd; i += 1) {
        const v0 = smoothed[i - 1];
        const v1 = smoothed[i];
        const v2 = smoothed[Math.min(winEnd, i + 1)];
        if (![v0, v1, v2].every(Number.isFinite)) continue;

        const riseNow = v1 - v0;
        const sustain = Math.max(0, v2 - v0);
        const level = Math.max(0, v1 - baseline);
        const centerPenalty = Math.abs(i - defaultDecision) * 0.03;
        const score = riseNow * 2.0 + sustain * 1.2 + level * 0.8 - centerPenalty;
        if (score > bestScore) {
            bestScore = score;
            bestIdx = i;
        }
    }

    if (!Number.isFinite(bestScore) || bestScore < 0) return defaultDecision;
    return clamp(bestIdx);
}

function detectStartFrameFromLeadMotion(landmarks, leadIdx, decisionIdx, contactIdx, fpsVal = 30) {
    if (!landmarks || !landmarks.length || !leadIdx) return 0;
    const n = landmarks.length;
    const clamp = (v) => Math.max(0, Math.min(n - 1, v));
    const toInt = (v, d) => (Number.isFinite(v) ? clamp(Math.round(v)) : d);

    const decision = toInt(decisionIdx, n - 1);
    const contact = toInt(contactIdx, n - 1);
    const maxLookback = Math.max(8, Math.round((Number.isFinite(fpsVal) ? fpsVal : 30) * 1.2));
    const winStart = Math.max(1, contact - maxLookback);
    const winEnd = Math.max(winStart + 1, Math.min(decision, contact - 1));

    if (winEnd <= winStart) return clamp(Math.max(0, decision - 6));

    const heelY = new Array(n).fill(null);
    const kneeX = new Array(n).fill(null);
    const hipX = new Array(n).fill(null);
    for (let i = 0; i < n; i += 1) {
        const lm = landmarks[i];
        if (!lm) continue;
        if (lm[leadIdx.heel]) heelY[i] = lm[leadIdx.heel].y;
        if (lm[leadIdx.knee]) kneeX[i] = lm[leadIdx.knee].x;
        if (lm[leadIdx.hip]) hipX[i] = lm[leadIdx.hip].x;
    }

    const heelYSmooth = smoothSeries(heelY, 1);
    const kneeXSmooth = smoothSeries(kneeX, 1);
    const hipXSmooth = smoothSeries(hipX, 1);

    // 1) Heel-lift onset first (y decreases when heel lifts in image coordinates).
    // Use early-frame "ground" baseline, then pick first sustained rise above it.
    const baselineVals = [];
    for (let i = winStart; i <= Math.min(winEnd, winStart + 8); i += 1) {
        const y = heelYSmooth[i];
        if (Number.isFinite(y)) baselineVals.push(y);
    }
    const baselineHeelY = baselineVals.length ? Math.max(...baselineVals) : null;
    const heelLift = new Array(n).fill(null);
    if (Number.isFinite(baselineHeelY)) {
        for (let i = winStart; i <= winEnd; i += 1) {
            const y = heelYSmooth[i];
            if (!Number.isFinite(y)) continue;
            heelLift[i] = Math.max(0, baselineHeelY - y);
        }
    }

    if (Number.isFinite(baselineHeelY)) {
        const liftVals = [];
        for (let i = winStart; i <= winEnd; i += 1) {
            if (Number.isFinite(heelLift[i])) liftVals.push(heelLift[i]);
        }
        liftVals.sort((a, b) => a - b);
        const q80 = liftVals.length
            ? liftVals[Math.floor((liftVals.length - 1) * 0.8)]
            : 0;
        const onsetThresh = Math.max(0.0045, q80 * 0.45);
        const riseThresh = Math.max(0.0010, onsetThresh * 0.22);

        for (let i = Math.max(winStart + 1, 1); i <= winEnd - 1; i += 1) {
            const v0 = heelLift[i - 1];
            const v1 = heelLift[i];
            const v2 = heelLift[i + 1];
            if (![v0, v1, v2].every(Number.isFinite)) continue;
            const rising = (v1 - v0) >= riseThresh;
            const sustained = v1 >= onsetThresh && v2 >= onsetThresh * 0.85;
            if (rising && sustained) return i;
        }

        // If lift is clear but onset is noisy, backtrack from first major lift peak.
        let peakIdx = -1;
        let peakVal = -Infinity;
        for (let i = winStart; i <= winEnd; i += 1) {
            const v = heelLift[i];
            if (!Number.isFinite(v)) continue;
            if (v > peakVal) {
                peakVal = v;
                peakIdx = i;
            }
        }
        if (peakIdx >= 0 && peakVal >= onsetThresh * 1.2) {
            const backThresh = Math.max(onsetThresh * 0.55, peakVal * 0.22);
            for (let j = peakIdx; j >= winStart + 1; j -= 1) {
                const v = heelLift[j];
                const p = heelLift[j - 1];
                if (!Number.isFinite(v) || !Number.isFinite(p)) continue;
                if (p <= backThresh && v > backThresh) return j;
            }
        }
    }

    // 2) No-stride fallback: first lead knee/hip forward onset.
    const signedVel = (series, sign) => {
        const out = new Array(n).fill(null);
        for (let i = 1; i < n; i += 1) {
            const a = series[i - 1], b = series[i];
            if (!Number.isFinite(a) || !Number.isFinite(b)) continue;
            out[i] = sign * (b - a);
        }
        return out;
    };

    let netHip = 0;
    let netKnee = 0;
    const tailStart = Math.max(winStart, winEnd - 6);
    for (let i = tailStart + 1; i <= winEnd; i += 1) {
        const h0 = hipXSmooth[i - 1], h1 = hipXSmooth[i];
        const k0 = kneeXSmooth[i - 1], k1 = kneeXSmooth[i];
        if (Number.isFinite(h0) && Number.isFinite(h1)) netHip += (h1 - h0);
        if (Number.isFinite(k0) && Number.isFinite(k1)) netKnee += (k1 - k0);
    }
    let forwardSign = Math.sign(Math.abs(netHip) >= Math.abs(netKnee) ? netHip : netKnee);
    if (!forwardSign) forwardSign = 1;

    const hipV = signedVel(hipXSmooth, forwardSign);
    const kneeV = signedVel(kneeXSmooth, forwardSign);
    const combo = new Array(n).fill(null);
    const pos = [];
    for (let i = winStart; i <= winEnd; i += 1) {
        const hv = Number.isFinite(hipV[i]) ? hipV[i] : -Infinity;
        const kv = Number.isFinite(kneeV[i]) ? kneeV[i] : -Infinity;
        const v = Math.max(hv, kv);
        if (Number.isFinite(v)) {
            combo[i] = v;
            if (v > 0) pos.push(v);
        }
    }
    pos.sort((a, b) => a - b);
    const q70 = pos.length ? pos[Math.floor((pos.length - 1) * 0.7)] : 0;
    const moveThresh = Math.max(0.0012, q70);

    for (let i = winStart; i <= winEnd; i += 1) {
        const v = combo[i];
        if (!Number.isFinite(v) || v < moveThresh) continue;
        const nxt = combo[Math.min(winEnd, i + 1)];
        if (!Number.isFinite(nxt) || nxt < moveThresh * 0.55) continue;
        return i;
    }

    // Final fallback: start near decision (not at earliest search bound),
    // then clamp into valid pre-decision window.
    return clamp(Math.max(winStart, Math.min(winEnd, decision - 6)));
}

function computeLeadMotionRawSeries(landmarks, leadIdx) {
    const n = landmarks ? landmarks.length : 0;
    const heel = new Array(n).fill(0);
    const knee = new Array(n).fill(0);
    const hip = new Array(n).fill(0);
    const heelY = new Array(n).fill(null);
    if (n > 0 && landmarks[0] && landmarks[0][leadIdx.heel]) {
        heelY[0] = landmarks[0][leadIdx.heel].y;
    }
    for (let i = 1; i < n; i += 1) {
        const prev = landmarks[i - 1];
        const curr = landmarks[i];
        if (!prev || !curr) continue;
        const pHeel = prev[leadIdx.heel], cHeel = curr[leadIdx.heel];
        const pKnee = prev[leadIdx.knee], cKnee = curr[leadIdx.knee];
        const pHip = prev[leadIdx.hip], cHip = curr[leadIdx.hip];
        if (pHeel && cHeel) heel[i] = cHeel.x - pHeel.x;
        if (pKnee && cKnee) knee[i] = cKnee.x - pKnee.x;
        if (pHip && cHip) hip[i] = cHip.x - pHip.x;
        if (cHeel) heelY[i] = cHeel.y;
    }
    return { heel, knee, hip, heelY };
}

function computeLeadForwardSign(rawKnee, rawHip, decisionIdx) {
    if (!rawKnee || !rawHip || !rawKnee.length || !rawHip.length) return 1;
    const n = Math.min(rawKnee.length, rawHip.length);
    const end = Math.max(1, Math.min(n - 1, Number.isFinite(decisionIdx) ? Math.round(decisionIdx) - 1 : n - 1));
    const start = Math.max(1, end - 10);
    let netKnee = 0;
    let netHip = 0;
    for (let i = start; i <= end; i += 1) {
        const kv = rawKnee[i];
        const hv = rawHip[i];
        if (Number.isFinite(kv)) netKnee += kv;
        if (Number.isFinite(hv)) netHip += hv;
    }
    const net = Math.abs(netHip) >= Math.abs(netKnee) ? netHip : netKnee;
    return net >= 0 ? 1 : -1;
}

function normalizeStartSeries(rawSeries, forwardSign, decisionIdx) {
    if (!rawSeries || !rawSeries.length) return [];
    const n = rawSeries.length;
    const end = Math.max(0, Math.min(n - 1, Number.isFinite(decisionIdx) ? Math.round(decisionIdx) : n - 1));
    const out = new Array(n).fill(null);
    for (let i = 1; i <= end; i += 1) {
        const v = rawSeries[i];
        if (!Number.isFinite(v)) continue;
        out[i] = v * forwardSign;
    }
    return out;
}

function refreshStartChartSeries() {
    if (!startRawSeries || !startRawKneeSeries || !startRawHipSeries || !startRawHeelYSeries) return;
    const n = Math.min(startRawSeries.length, startRawKneeSeries.length, startRawHipSeries.length, startRawHeelYSeries.length);
    const end = Math.max(0, Math.min(n - 1, Number.isFinite(decisionFrame) ? Math.round(decisionFrame) : n - 1));
    const sign = computeLeadForwardSign(startRawKneeSeries, startRawHipSeries, decisionFrame);

    // Heel channel should represent heel-lift magnitude (y decreases when heel lifts).
    const heelLift = new Array(n).fill(null);
    const heelVals = [];
    for (let i = 4; i <= Math.min(end, 12); i += 1) {
        const y = startRawHeelYSeries[i];
        if (Number.isFinite(y)) heelVals.push(y);
    }
    const baselineHeelY = heelVals.length ? (heelVals.reduce((a, b) => a + b, 0) / heelVals.length) : null;
    for (let i = 0; i <= end; i += 1) {
        const y = startRawHeelYSeries[i];
        if (!Number.isFinite(y) || !Number.isFinite(baselineHeelY)) continue;
        heelLift[i] = Math.max(0, baselineHeelY - y);
    }

    const kneeForward = normalizeStartSeries(startRawKneeSeries, sign, decisionFrame);
    const hipForward = normalizeStartSeries(startRawHipSeries, sign, decisionFrame);
    const kneeSmooth = smoothSeries(kneeForward, 1);
    const hipSmooth = smoothSeries(hipForward, 1);
    const heelSmooth = smoothSeries(heelLift, 1);

    // Remove early decoder jitter and post-decision data from the chart.
    const warmupCut = 1;
    for (let i = 0; i < n; i += 1) {
        if (i < warmupCut || i > end) {
            if (heelSmooth[i] !== undefined) heelSmooth[i] = null;
            if (kneeSmooth[i] !== undefined) kneeSmooth[i] = null;
            if (hipSmooth[i] !== undefined) hipSmooth[i] = null;
        }
    }

    startSeries = heelSmooth;
    startKneeSeries = kneeSmooth;
    startHipSeries = hipSmooth;
}

function updateGraphLine(selectedIdx) {
    if (!graphReady) return;
    drawContactDualSeriesChart("graph-contact", "Contact: Hip Distance (raw+smoothed) | marker=contact | selected=white", contactSeries, contactSmoothedSeries || smoothSeries(contactSeries || [], 2), contactFrame, selectedIdx);
    drawSeriesChart(
        "graph-decision",
        "Decision: Hand Speed | marker=decision | contact=blue | selected=white",
        decisionDisplaySeries || decisionSeries,
        decisionFrame,
        selectedIdx,
        [
            { idx: contactFrame, color: "#66aaff", width: 2 },
        ]
    );
    drawMultiSeriesChart(
        "graph-start",
        "Start: Heel lift + lead knee/hip forward | marker=start | selected=white",
        [
            { values: startSeries || [], color: "#42d9ff" },     // heel lift
            { values: startKneeSeries || [], color: "#ff9933" }, // knee forward
            { values: startHipSeries || [], color: "#ff66cc" },  // hip forward
        ],
        startFrame,
        selectedIdx
    );
}

function eventTypeForFrame(i) {
    if (i === startFrame) return "start";
    if (i === decisionFrame) return "decision";
    if (i === contactFrame) return "contact";
    return "null";
}

function csvEscape(v) {
    const s = v == null ? "" : String(v);
    if (/[",\r\n]/.test(s)) return `"${s.replace(/"/g, "\"\"")}"`;
    return s;
}

function buildPoseTableCSV() {
    const rows = [];
    rows.push(["frame_number", "event_type", "mediapipe_pose_marker", "mediapipe_pose_data"]);
    const frameCount = frames.length || (poseLandmarksFrames ? poseLandmarksFrames.length : 0);
    const hasContact = Number.isFinite(contactFrame) && contactFrame >= 0;
    const exportEnd = hasContact
        ? Math.min(frameCount - 1, Math.round(contactFrame) + 10)
        : Math.max(0, frameCount - 1);

    for (let fi = 0; fi <= exportEnd; fi += 1) {
        const frameLm = poseLandmarksFrames && poseLandmarksFrames[fi] ? poseLandmarksFrames[fi] : null;
        const eventType = eventTypeForFrame(fi);
        for (let li = 0; li < POSE_LANDMARK_NAMES.length; li += 1) {
            const marker = POSE_LANDMARK_NAMES[li] || `landmark_${li}`;
            const lm = frameLm && frameLm[li] ? frameLm[li] : null;
            const poseData = lm ? JSON.stringify(lm) : "null";
            rows.push([fi, eventType, marker, poseData]);
        }
    }
    return {
        csv: rows.map((r) => r.map(csvEscape).join(",")).join("\n"),
        exportEnd,
    };
}

slider.oninput = () => drawFrame(+slider.value);

document.getElementById("prev_frame_btn").onclick = () => {
    if (!frames.length) return;
    const curr = +slider.value || 0;
    const next = Math.max(0, curr - 1);
    slider.value = next;
    drawFrame(next);
};

document.getElementById("next_frame_btn").onclick = () => {
    if (!frames.length) return;
    const curr = +slider.value || 0;
    const maxIdx = Math.max(0, frames.length - 1);
    const next = Math.min(maxIdx, curr + 1);
    slider.value = next;
    drawFrame(next);
};

document.getElementById("goto_start_btn").onclick = () => {
    if (!frames.length) return;
    const target = Math.max(0, Math.min(frames.length - 1, Number.isFinite(startFrame) ? startFrame : 0));
    slider.value = target;
    drawFrame(target);
};

document.getElementById("goto_decision_btn").onclick = () => {
    if (!frames.length) return;
    const target = Math.max(0, Math.min(frames.length - 1, Number.isFinite(decisionFrame) ? decisionFrame : 0));
    slider.value = target;
    drawFrame(target);
};

document.getElementById("goto_contact_btn").onclick = () => {
    if (!frames.length) return;
    const target = Math.max(0, Math.min(frames.length - 1, Number.isFinite(contactFrame) ? contactFrame : 0));
    slider.value = target;
    drawFrame(target);
};

    previewScale = Math.min(previewScale + 0.25, 3.0);
    drawFrame(+slider.value);
};

document.getElementById("zoom_out").onclick = () => {
    previewScale = Math.max(previewScale - 0.25, 0.5);
    drawFrame(+slider.value);
};

document.getElementById("zoom_reset").onclick = () => {
    previewScale = 1.0;
    drawFrame(+slider.value);
};

document.getElementById("set_start_btn").onclick = () => {
    startFrame = +slider.value;
    markerStatus.textContent =
        `Start = ${startFrame}`;
    updateGraphLine(+slider.value || 0);
};

document.getElementById("set_decision_btn").onclick = () => {
    decisionFrame = +slider.value;
    markerStatus.textContent =
        `Decision = ${decisionFrame}`;
    updateGraphLine(+slider.value || 0);
};

document.getElementById("set_contact_btn").onclick = () => {
    contactFrame = +slider.value;
    markerStatus.textContent =
        `Contact = ${contactFrame}`;
    updateGraphLine(+slider.value || 0);
};

document.getElementById("pick_batter_btn").onclick = () => {
    if (!frames.length) return;
    awaitingManualPick = true;
    markerStatus.textContent = "Click batter on the preview frame to lock subject.";
};

canvas.addEventListener("click", (ev) => {
    if (!awaitingManualPick || !frames.length) return;
    const i = +slider.value || 0;
    const f = frames[i];
    if (!f) return;

    const size = canvas.width;
    const scale = Math.min(size / f.width, size / f.height);
    const w = Math.round(f.width * scale);
    const h = Math.round(f.height * scale);
    const drawX = Math.round((size - w) / 2);
    const drawY = Math.round((size - h) / 2);

    const rx = ev.offsetX;
    const ry = ev.offsetY;
    const nx = (rx - drawX) / Math.max(1, w);
    const ny = (ry - drawY) / Math.max(1, h);

    manualSeedPoint = {
        frame: i,
        x: Math.max(0, Math.min(1, nx)),
        y: Math.max(0, Math.min(1, ny)),
    };
    awaitingManualPick = false;
    markerStatus.textContent = `Batter locked at frame ${i}. Click Autodetect.`;
});

document.getElementById("build_charts_btn").onclick = async () => {
    if (!frames.length) return;
    if (!manualSeedPoint) {
        markerStatus.textContent = "Click Pick Batter, then click the batter, then Autodetect.";
        return;
    }

    const sameSeedAsLastBuild =
        !!lastBuildSeedPoint &&
        lastBuildSeedPoint.frame === manualSeedPoint.frame &&
        Math.hypot(lastBuildSeedPoint.x - manualSeedPoint.x, lastBuildSeedPoint.y - manualSeedPoint.y) <= 0.015;

    if (graphReady && sameSeedAsLastBuild && contactSeries && contactSeries.length) {
        if (!contactSmoothedSeries || !contactSmoothedSeries.length) {
            contactSmoothedSeries = smoothSeries(contactSeries, 2);
        }
        if ((!decisionDisplaySeries || !decisionDisplaySeries.length) && poseLandmarksFrames && poseLandmarksFrames.length) {
            decisionDisplaySeries = buildDecisionDisplaySeries(poseLandmarksFrames);
        }
        const selectedNow = +slider.value || 0;
        // Enforce ordering rule: decision (hands fast) must happen before contact.
        const handOnsetGate = detectHandOnsetForContactGate(decisionSeries, decisionFrame);
        const minContactIdx = Math.max(0, handOnsetGate + 1);
        const autoContact = detectContactFrameFromHipSeries(contactSeries, selectedNow, minContactIdx);
        if (Number.isFinite(autoContact)) contactFrame = autoContact;
        decisionFrame = detectDecisionFrameFromHandSeries(decisionSeries, contactFrame, handOnsetGate);
        if (!startRawSeries || !startRawKneeSeries || !startRawHipSeries) {
            const leadIdxReuse = leadSide === "left"
                ? { heel: 27, knee: 25, hip: 23 }
                : { heel: 28, knee: 26, hip: 24 };
            const rawReuse = computeLeadMotionRawSeries(poseLandmarksFrames, leadIdxReuse);
            startRawSeries = rawReuse.heel;
            startRawKneeSeries = rawReuse.knee;
            startRawHipSeries = rawReuse.hip;
            startRawHeelYSeries = rawReuse.heelY;
        }
        refreshStartChartSeries();
        const autoStart = detectStartFrameFromLeadMotion(
            poseLandmarksFrames,
            leadSide === "left"
                ? { heel: 27, knee: 25, hip: 23 }
                : { heel: 28, knee: 26, hip: 24 },
            decisionFrame,
            contactFrame,
            fps
        );
        if (Number.isFinite(autoStart)) startFrame = autoStart;
        markerStatus.textContent = `Charts reused (start=${startFrame}, decision=${decisionFrame}, auto-contact=${contactFrame})`;
        updateGraphLine(selectedNow);
        return;
    }

    markerStatus.textContent = "Building pose charts...";
    await resetPoseInstance();
    const pose = await ensurePose();
    if (!pose) {
        markerStatus.textContent = "Pose library unavailable.";
        return;
    }
    markerStatus.textContent = `Building pose charts... tracking locked batter ${manualSeedPoint.frame + 1}/${frames.length}`;
    const landmarks = await trackBatterFromManualSeed(manualSeedPoint);
    if (!landmarks) {
        markerStatus.textContent = "Manual batter lock failed. Re-pick batter on frame 0-5.";
        return;
    }
    poseLandmarksFrames = landmarks;

    const n = landmarks.length;
    contactSeries = new Array(n).fill(null);
    contactSmoothedSeries = null;
    decisionSeries = new Array(n).fill(0);
    decisionDisplaySeries = new Array(n).fill(null);
    startSeries = new Array(n).fill(null);
    startKneeSeries = new Array(n).fill(null);
    startHipSeries = new Array(n).fill(null);
    startRawSeries = new Array(n).fill(0);
    startRawKneeSeries = new Array(n).fill(0);
    startRawHipSeries = new Array(n).fill(0);
    startRawHeelYSeries = new Array(n).fill(null);

    const sideScore = { left: 0, right: 0 };
    for (let i = 1; i < n; i += 1) {
        const prev = landmarks[i - 1];
        const curr = landmarks[i];
        if (!prev || !curr) continue;
        if (prev[27] && curr[27]) sideScore.left += Math.abs(curr[27].x - prev[27].x);
        if (prev[28] && curr[28]) sideScore.right += Math.abs(curr[28].x - prev[28].x);
    }
    const lead = sideScore.left >= sideScore.right ? "left" : "right";
    leadSide = lead;
    const leadIdx = lead === "left"
        ? { heel: 27, knee: 25, hip: 23, wrist: 15, otherWrist: 16 }
        : { heel: 28, knee: 26, hip: 24, wrist: 16, otherWrist: 15 };
    if (n > 0 && landmarks[0] && landmarks[0][leadIdx.heel]) {
        startRawHeelYSeries[0] = landmarks[0][leadIdx.heel].y;
    }

    for (let i = 1; i < n; i += 1) {
        const prev = landmarks[i - 1];
        const curr = landmarks[i];
        if (!curr || !prev) continue;

        const lHip = curr[23], rHip = curr[24];
        if (lHip && rHip) {
            const dx = lHip.x - rHip.x;
            const dy = lHip.y - rHip.y;
            contactSeries[i] = Math.hypot(dx, dy);
        }

        const w0 = prev[leadIdx.wrist], w1 = curr[leadIdx.wrist];
        const ow0 = prev[leadIdx.otherWrist], ow1 = curr[leadIdx.otherWrist];
        let handSpeed = 0;
        if (w0 && w1) handSpeed = Math.max(handSpeed, Math.hypot(w1.x - w0.x, w1.y - w0.y));
        if (ow0 && ow1) handSpeed = Math.max(handSpeed, Math.hypot(ow1.x - ow0.x, ow1.y - ow0.y));
        decisionSeries[i] = handSpeed;

        const pHeel = prev[leadIdx.heel], cHeel = curr[leadIdx.heel];
        const pKnee = prev[leadIdx.knee], cKnee = curr[leadIdx.knee];
        const pHip = prev[leadIdx.hip], cHip = curr[leadIdx.hip];
        if (pHeel && cHeel) startRawSeries[i] = cHeel.x - pHeel.x;
        if (pKnee && cKnee) startRawKneeSeries[i] = cKnee.x - pKnee.x;
        if (pHip && cHip) startRawHipSeries[i] = cHip.x - pHip.x;
        if (cHeel) startRawHeelYSeries[i] = cHeel.y;
    }

    contactSmoothedSeries = smoothSeries(contactSeries, 2);
    decisionDisplaySeries = buildDecisionDisplaySeries(landmarks);

    const selectedNow = +slider.value || 0;
    // Enforce ordering rule: decision (hands fast) must happen before contact.
    const handOnsetGate = detectHandOnsetForContactGate(decisionSeries, decisionFrame);
    const minContactIdx = Math.max(0, handOnsetGate + 1);
    const autoContact = detectContactFrameFromHipSeries(contactSeries, selectedNow, minContactIdx);
    if (Number.isFinite(autoContact)) {
        contactFrame = autoContact;
    }
    decisionFrame = detectDecisionFrameFromHandSeries(decisionSeries, contactFrame, handOnsetGate);
    refreshStartChartSeries();
    const autoStart = detectStartFrameFromLeadMotion(
        landmarks,
        { heel: leadIdx.heel, knee: leadIdx.knee, hip: leadIdx.hip },
        decisionFrame,
        contactFrame,
        fps
    );
    if (Number.isFinite(autoStart)) startFrame = autoStart;
    lastBuildSeedPoint = {
        frame: manualSeedPoint.frame,
        x: manualSeedPoint.x,
        y: manualSeedPoint.y,
    };

    ensureGraphCanvas("graph-contact", "marker_status");
    ensureGraphCanvas("graph-decision", "graph-contact");
    ensureGraphCanvas("graph-start", "graph-decision");
    graphReady = true;
    const subjectMode = manualSeedPoint ? "manual-lock" : "batter-track";
    markerStatus.textContent = `Charts built (subject=${subjectMode}, lead side=${lead}, start=${startFrame}, decision=${decisionFrame}, auto-contact=${contactFrame})`;
    updateGraphLine(+slider.value || 0);
};

////////////////////////////////////////////////////////////
// TRIM + UPLOAD
////////////////////////////////////////////////////////////
const { createFFmpeg } = FFmpeg;
const PORTRAIT_OUT_W = 720;
const PORTRAIT_OUT_H = 1280;
const PORTRAIT_ASPECT = PORTRAIT_OUT_W / PORTRAIT_OUT_H;

async function bitmapToPNG(bitmap) {
    const off = new OffscreenCanvas(bitmap.width, bitmap.height);
    const ctx = off.getContext("2d");
    ctx.drawImage(bitmap, 0, 0);
    const blob = await off.convertToBlob({ type: "image/png" });
    return new Uint8Array(await blob.arrayBuffer());
}

function computePortraitCropFromLandmarks(lm, fallback = null) {
    if (!lm || !lm.length) return fallback;
    const idxs = [11, 12, 23, 24, 25, 26, 27, 28, 15, 16];
    const pts = [];
    for (const idx of idxs) {
        const p = lm[idx];
        if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
        pts.push({ x: p.x, y: p.y });
    }
    if (pts.length < 4) return fallback;

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    for (const p of pts) {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    }
    const boxW = Math.max(0.001, maxX - minX);
    const boxH = Math.max(0.001, maxY - minY);
    const cx = (minX + maxX) * 0.5;
    const cy = ((minY + maxY) * 0.5) - (boxH * 0.08);

    // Keep batter framed reasonably tight while preserving a portrait window.
    let cropH = Math.max(boxH * 1.75, 0.56);
    let cropW = cropH * PORTRAIT_ASPECT;
    cropW = Math.max(cropW, boxW * 1.55);
    cropH = cropW / PORTRAIT_ASPECT;
    cropH = Math.min(cropH, 0.95);
    cropW = Math.min(cropW, 0.95);

    let x = cx - cropW * 0.5;
    let y = cy - cropH * 0.5;
    x = Math.max(0, Math.min(1 - cropW, x));
    y = Math.max(0, Math.min(1 - cropH, y));
    return { x, y, w: cropW, h: cropH };
}

function smoothCropSeries(crops, radius = 2) {
    if (!crops || !crops.length) return [];
    const out = new Array(crops.length).fill(null);
    for (let i = 0; i < crops.length; i += 1) {
        let sx = 0, sy = 0, sw = 0, sh = 0, n = 0;
        for (let k = -radius; k <= radius; k += 1) {
            const j = i + k;
            if (j < 0 || j >= crops.length) continue;
            const c = crops[j];
            if (!c) continue;
            sx += c.x; sy += c.y; sw += c.w; sh += c.h; n += 1;
        }
        if (n) out[i] = { x: sx / n, y: sy / n, w: sw / n, h: sh / n };
    }
    return out;
}

function buildPortraitCropSeries(landmarksSeq) {
    if (!landmarksSeq || !landmarksSeq.length) return [];
    const raw = new Array(landmarksSeq.length).fill(null);
    let prev = null;
    for (let i = 0; i < landmarksSeq.length; i += 1) {
        const c = computePortraitCropFromLandmarks(landmarksSeq[i], prev);
        raw[i] = c;
        if (c) prev = c;
    }
    const smooth = smoothCropSeries(raw, 2);
    let last = null;
    for (let i = 0; i < smooth.length; i += 1) {
        if (smooth[i]) last = smooth[i];
        else if (last) smooth[i] = last;
    }
    return smooth;
}

async function bitmapToPortraitPNG(bitmap, crop) {
    const out = new OffscreenCanvas(PORTRAIT_OUT_W, PORTRAIT_OUT_H);
    const outCtx = out.getContext("2d");
    outCtx.fillStyle = "black";
    outCtx.fillRect(0, 0, PORTRAIT_OUT_W, PORTRAIT_OUT_H);

    let sx = 0;
    let sy = 0;
    let sw = bitmap.width;
    let sh = bitmap.height;
    if (crop) {
        sx = Math.max(0, Math.floor(crop.x * bitmap.width));
        sy = Math.max(0, Math.floor(crop.y * bitmap.height));
        sw = Math.max(1, Math.floor(crop.w * bitmap.width));
        sh = Math.max(1, Math.floor(crop.h * bitmap.height));
        if (sx + sw > bitmap.width) sw = bitmap.width - sx;
        if (sy + sh > bitmap.height) sh = bitmap.height - sy;
    } else {
        const srcAspect = bitmap.width / bitmap.height;
        if (srcAspect > PORTRAIT_ASPECT) {
            sw = Math.max(1, Math.floor(bitmap.height * PORTRAIT_ASPECT));
            sx = Math.floor((bitmap.width - sw) * 0.5);
        } else {
            sh = Math.max(1, Math.floor(bitmap.width / PORTRAIT_ASPECT));
            sy = Math.floor((bitmap.height - sh) * 0.5);
        }
    }
    outCtx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, PORTRAIT_OUT_W, PORTRAIT_OUT_H);
    const blob = await out.convertToBlob({ type: "image/png" });
    return new Uint8Array(await blob.arrayBuffer());
}

async function trimAndUpload() {
    if (contactFrame <= startFrame) {
        alert("Contact must be after start.");
        return;
    }

    showProgress();
    updateProgress(10, "Loading FFmpegâ€¦");

    const ffmpeg = createFFmpeg({
        corePath: "/static/js/ffmpeg/ffmpeg-core.js",
        log: true
    });
    await ffmpeg.load();

    const selectedLandmarks = poseLandmarksFrames
        ? poseLandmarksFrames.slice(startFrame, contactFrame + 1)
        : [];
    const usePortraitCrop = selectedLandmarks.some((lm) => !!lm);
    const portraitCrops = usePortraitCrop ? buildPortraitCropSeries(selectedLandmarks) : null;

    updateProgress(25, usePortraitCrop ? "Preparing portrait framesâ€¦" : "Preparing framesâ€¦");

    const selected = frames.slice(startFrame, contactFrame + 1);
    const trimmedDecision = decisionFrame - startFrame;

    for (let i = 0; i < selected.length; i++) {
        const framePng = usePortraitCrop
            ? await bitmapToPortraitPNG(selected[i], portraitCrops ? portraitCrops[i] : null)
            : await bitmapToPNG(selected[i]);
        ffmpeg.FS("writeFile", `f_${i}.png`,
            framePng);
        if (i % 5 === 0) {
            updateProgress(25 + (i / selected.length) * 30,
                `Preparing frame ${i}/${selected.length}`);
        }
    }

    updateProgress(60, "Encoding MP4â€¦");

    await ffmpeg.run(
        "-framerate", String(fps),
        "-i", "f_%d.png",
        "-c:v", "libx264",
        "-pix_fmt", "yuv420p",
        "-preset", "fast",
        "-crf", "23",
        "out.mp4"
    );

    updateProgress(90, "Uploadingâ€¦");

    const out = ffmpeg.FS("readFile", "out.mp4");
    const blob = new Blob([out.buffer], { type: "video/mp4" });

    const form = new FormData();
    form.append("sid", SID);
    form.append("team_id", TEAM_ID);
    form.append("hitter_id", HITTER_ID);
    form.append("description", DESCRIPTION);
    form.append("fps", fps);
    form.append("decision_frame", trimmedDecision);
    form.append("file", blob, "trimmed_swing.mp4");

    const r = await fetch(`/upload/swing/finalize`, {
        method: "POST",
        body: form
    });

    if (r.ok) {
        updateProgress(100, "Saved!");
        window.location.href = `/library?sid=${SID}&type=swing`;
    } else {
        alert("Upload failed.");
    }
}

document.getElementById("finalize_btn").onclick = trimAndUpload;

document.getElementById("export_pose_table_btn").onclick = () => {
    if (!poseLandmarksFrames || !poseLandmarksFrames.length) {
        markerStatus.textContent = "No pose data yet. Click Autodetect first.";
        return;
    }
    const out = buildPoseTableCSV();
    const ta = document.getElementById("pose_table_output");
    ta.value = out.csv;
    markerStatus.textContent = `Pose table ready: frames 0-${out.exportEnd} x ${POSE_LANDMARK_NAMES.length} landmarks.`;
};

document.getElementById("copy_pose_table_btn").onclick = async () => {
    const ta = document.getElementById("pose_table_output");
    if (!ta.value) {
        markerStatus.textContent = "Nothing to copy yet. Click Export Pose Table CSV.";
        return;
    }
    try {
        await navigator.clipboard.writeText(ta.value);
        markerStatus.textContent = "Pose table copied to clipboard.";
    } catch (e) {
        markerStatus.textContent = "Clipboard copy failed. Select and copy the text area manually.";
    }
};

</script>
