{% extends 'base.html' %}
{% block content %}

<h2>Play Pitch Clip</h2>

<div style="max-width:480px;">

    <video 
        id="player"
        controls
        preload="metadata"
        style="
            width:100%;
            max-height:480px;
            object-fit:contain;
            background:#000;
            border-radius:8px;
        "
    >
        <source src="/stream/pitch?id={{ id }}" type="video/mp4">
    </video>

    <!-- CONTROL BAR -->
    <div style="margin-top:15px; display:flex; gap:20px; align-items:center;">

        <!-- DOWNLOAD BUTTON -->
        <button id="download_btn"
                style="padding:8px 14px; font-size:15px;">
            Download Video
        </button>

        <!-- SPEED CONTROL (ONLY SLOW-MO) -->
        <label for="speed_select" style="color:#ccc;">Speed:</label>
        <select id="speed_select"
                style="padding:6px; font-size:14px;">
            <option value="1" selected>1x Normal</option>
            <option value="0.75">0.75x</option>
            <option value="0.5">0.5x</option>
            <option value="0.25">0.25x</option>
        </select>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const player = document.getElementById("player");

    // Correct: read src from the <source> tag inside <video>
    const videoURL = player.querySelector("source").src;

    // -------------------------------------------------------
    // DOWNLOAD BUTTON
    // -------------------------------------------------------
    document.getElementById("download_btn").onclick = () => {
        const a = document.createElement("a");
        a.href = videoURL;
        a.download = "pitch_{{ id }}.mp4";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };

    // -------------------------------------------------------
    // SPEED CONTROL
    // -------------------------------------------------------
    document.getElementById("speed_select").onchange = (e) => {
        player.playbackRate = parseFloat(e.target.value);
    };
});

</script>

{% endblock %}
