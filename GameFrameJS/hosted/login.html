<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · GameFrame</title>
<style>body{background:#14231c;color:#f4f4e9;font:18px system-ui;max-width:440px;margin:8vh auto;padding:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;font:inherit}a{color:#c8d77a}</style>
<h1>GameFrame</h1><p>Sign in with a code sent to your email. The beta is currently by invitation.</p>
<form id="login"><label>Email<input name="email" type="email" required autocomplete="email"></label><button>Send sign-in code</button></form>
<form id="verify" hidden><label>Code<input name="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button>Sign in</button></form><p id="status" role="status"></p>
<script>let email;async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Please try again.');return data}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();email=new FormData(e.target).get('email');try{await post('/api/v1/auth/request-code',{email});document.getElementById('verify').hidden=false;document.getElementById('status').textContent='Check your email for your sign-in code.'}catch(e){document.getElementById('status').textContent=e.message}};
document.getElementById('verify').onsubmit=async e=>{e.preventDefault();try{await post('/api/v1/auth/verify-code',{email,code:new FormData(e.target).get('code')});location.href='/'}catch(e){document.getElementById('status').textContent=e.message}};</script></html>
