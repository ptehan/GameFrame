{% extends 'base.html' %}
{% block content %}

<h2>Library</h2>

<style>
.library-filter-bar {
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
}
.library-filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 170px;
    min-width: 0;
    max-width: 240px;
}
.library-filter-control {
    width: 100% !important;
    max-width: 100%;
    box-sizing: border-box;
}
.library-filter-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex: 0 0 auto;
}
.library-details {
    width: 100%;
}
.library-summary {
    cursor: pointer;
    font-size: 12px;
    line-height: 1.35;
    color: #bdbdbd;
}
.library-summary-desc {
    opacity: 0.9;
}
.library-details[open] .library-summary {
    margin-bottom: 10px;
    color: #ddd;
}
.library-expanded {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 14px;
    min-width: 0;
}
.library-thumb-wrap {
    width: 130px;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 4px;
    border: 1px solid #444;
    flex-shrink: 0;
    background: #000;
}
.library-thumb-wrap .thumb {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center center;
    border: 0 !important;
    display: block;
}
.pose-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}
.pose-modal-card {
    width: min(92vw, 860px);
    max-height: 90vh;
    overflow: auto;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
}
.pose-modal-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.pose-canvas {
    width: 100%;
    max-width: 820px;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    display: block;
}
#library_grid .library-item,
#library_grid .library-item .info,
#library_grid .library-item .actions {
    min-width: 0;
}
#library_grid .library-item .info {
    overflow-wrap: anywhere;
}
@media (max-width: 1200px) {
    .card-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
    }
}
@media (max-width: 900px) {
    .library-filter-group {
        flex: 1 1 100%;
        max-width: none;
    }
    .library-filter-actions {
        margin-left: 0;
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
    }
    .library-item {
        flex-wrap: wrap;
    }
    .library-item .actions {
        width: 100%;
        margin-left: 0;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
    }
    .library-expanded {
        flex-wrap: wrap;
    }
}
</style>

<!-- FILTER BAR -->
<div class="panel library-filter-bar">

    <div class="library-filter-group">
        <label>Type:</label><br>
        <select id="filter_type" class="library-filter-control">
            <option value="matchup">Matchups</option>
            <option value="swing">Swing Clips</option>
            <option value="pitch">Pitch Clips</option>
        </select>
    </div>

    <div class="library-filter-group">
        <label>Search:</label><br>
        <input id="filter_text" type="text" placeholder="Search…" class="library-filter-control">
    </div>

    <div class="library-filter-group">
        <label>Pitcher Team:</label><br>
        <select id="filter_pitcher_team" class="library-filter-control">
            <option value="">All</option>
        </select>
    </div>

    <div class="library-filter-group">
        <label>Hitter Team:</label><br>
        <select id="filter_hitter_team" class="library-filter-control">
            <option value="">All</option>
        </select>
    </div>

    <div class="library-filter-group">
        <label>Pitcher:</label><br>
        <select id="filter_pitcher" class="library-filter-control">
            <option value="">All</option>
        </select>
    </div>

    <div class="library-filter-group">
        <label>Hitter:</label><br>
        <select id="filter_hitter" class="library-filter-control">
            <option value="">All</option>
        </select>
    </div>
    <div class="library-filter-actions">
        <button type="button" id="expand_swings_btn">Expand Visible Cards</button>
        <button type="button" id="collapse_swings_btn">Collapse Visible Cards</button>
    </div>

</div>


<!-- GRID -->
<div id="library_grid" class="card-grid"></div>

<div id="pose_modal" class="pose-modal">
    <div class="pose-modal-card">
        <div class="pose-modal-toolbar">
            <b id="pose_modal_title">Pose Animation</b>
            <button type="button" id="pose_play_btn">Play</button>
            <button type="button" id="pose_pause_btn">Pause</button>
            <button type="button" id="pose_close_btn" style="margin-left:auto;">Close</button>
        </div>
        <canvas id="pose_canvas" class="pose-canvas" width="1280" height="720"></canvas>
        <canvas id="pose_change_chart" class="pose-canvas" width="1280" height="320" style="margin-top:10px; aspect-ratio: 16 / 4;"></canvas>
        <div style="margin-top:10px; display:grid; gap:10px;">
            <label for="pose_timeline_slider" style="display:grid; gap:6px;">
                <span style="font-size:13px; opacity:0.85;">Timeline</span>
                <input type="range" id="pose_timeline_slider" min="0" max="0" value="0" step="1">
            </label>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span style="font-size:13px; opacity:0.85;">Speed</span>
                <button type="button" class="pose-speed-btn" data-speed="0.25">0.25x</button>
                <button type="button" class="pose-speed-btn" data-speed="0.5">0.5x</button>
                <button type="button" class="pose-speed-btn" data-speed="0.75">0.75x</button>
                <button type="button" class="pose-speed-btn" data-speed="1">1x</button>
                <span id="pose_speed_value" style="min-width:42px; font-size:13px; text-align:right;">1.00x</span>
            </div>
        </div>
        <div id="pose_status" style="margin-top:6px; opacity:0.8; font-size:13px;"></div>
    </div>
</div>


<script>
const sid = "{{ sid }}";

let rowNodes = [];
let rawItems = [];

const fType          = document.getElementById("filter_type");
const fText          = document.getElementById("filter_text");
const fPitcherTeam   = document.getElementById("filter_pitcher_team");
const fHitterTeam    = document.getElementById("filter_hitter_team");
const fPitcher       = document.getElementById("filter_pitcher");
const fHitter        = document.getElementById("filter_hitter");
const expandSwingsBtn = document.getElementById("expand_swings_btn");
const collapseSwingsBtn = document.getElementById("collapse_swings_btn");
const poseModal = document.getElementById("pose_modal");
const poseCanvas = document.getElementById("pose_canvas");
const poseCtx = poseCanvas.getContext("2d");
const poseChangeChart = document.getElementById("pose_change_chart");
const poseChangeCtx = poseChangeChart ? poseChangeChart.getContext("2d") : null;
const poseModalTitle = document.getElementById("pose_modal_title");
const poseTimelineSlider = document.getElementById("pose_timeline_slider");
const poseStatus = document.getElementById("pose_status");
const posePlayBtn = document.getElementById("pose_play_btn");
const posePauseBtn = document.getElementById("pose_pause_btn");
const poseSpeedValue = document.getElementById("pose_speed_value");
const poseSpeedButtons = Array.from(document.querySelectorAll(".pose-speed-btn"));
const poseCloseBtn = document.getElementById("pose_close_btn");
const POSE_CONNECTIONS = [
    ["shoulder1", "shoulder2"],
    ["shoulder1", "elbow1"], ["elbow1", "wrist1"],
    ["shoulder2", "elbow2"], ["elbow2", "wrist2"],
    ["shoulder1", "hip1"], ["shoulder2", "hip2"], ["hip1", "hip2"],
    ["hip1", "knee1"], ["knee1", "ankle1"],
    ["hip2", "knee2"], ["knee2", "ankle2"],
];
let poseAnimRows = [];
let poseAnimIndex = 0;
let poseAnimFps = 30;
let poseAnimPlaying = false;
let poseAnimRaf = null;
let poseAnimLastTs = 0;
let poseAnimSpeed = 1;
let poseAnimFrameCarry = 0;
let poseChangeSeries = null;


// ------------------------------------------------------------
// RESTORE FILTER STATE FROM URL
// ------------------------------------------------------------
const url = new URL(window.location.href);

const savedType        = url.searchParams.get("type")   || "matchup";
const savedSearch      = url.searchParams.get("search") || "";
const savedPitcherTeam = url.searchParams.get("pteam")  || "";
const savedHitterTeam  = url.searchParams.get("hteam")  || "";
const savedPitcher     = url.searchParams.get("pitcher")|| "";
const savedHitter      = url.searchParams.get("hitter") || "";


// APPLY SAVED VALUES TO UI
fType.value        = savedType;
fText.value        = savedSearch;
fPitcherTeam.value = savedPitcherTeam;
fHitterTeam.value  = savedHitterTeam;
fPitcher.value     = savedPitcher;
fHitter.value      = savedHitter;


// ------------------------------------------------------------
// UPDATE URL WITHOUT RELOAD
// ------------------------------------------------------------
function updateURL() {
    const url = new URL(window.location.href);

    url.searchParams.set("type", fType.value);
    url.searchParams.set("search", fText.value);

    if (fPitcherTeam.value) url.searchParams.set("pteam", fPitcherTeam.value);
    else url.searchParams.delete("pteam");

    if (fHitterTeam.value) url.searchParams.set("hteam", fHitterTeam.value);
    else url.searchParams.delete("hteam");

    if (fPitcher.value) url.searchParams.set("pitcher", fPitcher.value);
    else url.searchParams.delete("pitcher");

    if (fHitter.value) url.searchParams.set("hitter", fHitter.value);
    else url.searchParams.delete("hitter");

    history.replaceState(null, "", url);
}


// ------------------------------------------------------------
// LOAD DATA FROM SERVER
// ------------------------------------------------------------
async function loadData(type) {
    const grid = document.getElementById("library_grid");
    grid.innerHTML = "<div style='opacity:0.6;'>Loading...</div>";

    const res = await fetch(`/library/data?type=${type}&sid=${sid}`);
    const items = await res.json();

    rawItems = items;

    buildGrid(items);
    rebuildFilterOptions(items);
    applyFilters();
}


// ------------------------------------------------------------
// BUILD GRID
// ------------------------------------------------------------
function buildGrid(items) {
    const grid = document.getElementById("library_grid");
    let html = "";

    items.forEach(c => {

        let pitcher_team = "";
        let hitter_team  = "";

        if (c.type === "pitch") {
            pitcher_team = (c.team_name || "").toLowerCase();
        }
        else if (c.type === "swing") {
            hitter_team = (c.team_name || "").toLowerCase();
        }
        else if (c.type === "matchup") {
            pitcher_team = (c.pitcher_team || "").toLowerCase();
            hitter_team  = (c.hitter_team  || "").toLowerCase();
        }
        else if (c.type === "multi") {
            pitcher_team = [
                (c.pitcherA_team || "").toLowerCase(),
                (c.pitcherB_team || "").toLowerCase()
            ].join(" ").trim();
            hitter_team = (c.hitter_team || "").toLowerCase();
        }

        const pitcher = (c.pitcher_name || "").toLowerCase();
        const hitter  = (c.hitter_name  || "").toLowerCase();
        const text    = (c.description  || "").toLowerCase();
        const hasPoseData = (c.type === "swing" && Number(c.has_pose_data || 0) > 0);
        const isCollapsibleType = (c.type === "swing" || c.type === "pitch" || c.type === "matchup");
        const swingDur = (c.swing_duration_seconds != null && Number.isFinite(Number(c.swing_duration_seconds)))
            ? `${Number(c.swing_duration_seconds).toFixed(3)}s`
            : "n/a";
        const summaryTitle = c.type === "swing"
            ? `${c.hitter_name || "Unknown Hitter"} (${c.team_name || "Unknown Team"})`
            : c.type === "pitch"
                ? `${c.pitcher_name || "Unknown Pitcher"} (${c.team_name || "Unknown Team"})`
                : c.type === "matchup"
                    ? `${c.pitcher_name || "Unknown Pitcher"} vs ${c.hitter_name || "Unknown Hitter"}`
                    : `${c.type || "Clip"}`;
        const summaryDesc = (c.description || "No description");
        const expandedInfoHtml = c.type === "swing"
            ? `<b>${c.hitter_name || "Unknown Hitter"}</b> (${c.team_name || "Unknown Team"})<br>
               ${c.description || ""}<br>
               Swing Duration: ${swingDur}<br><br>
               Created: ${c.created_at}`
            : c.type === "pitch"
                ? `<b>${c.pitcher_name || "Unknown Pitcher"}</b> (${c.team_name || "Unknown Team"})<br>
                   ${c.description || ""}<br><br>
                   Created: ${c.created_at}`
                : c.type === "matchup"
                    ? `Pitcher: ${c.pitcher_name || "Unknown Pitcher"} (${c.pitcher_team || "Unknown Team"})<br>
                       Hitter: ${c.hitter_name || "Unknown Hitter"} (${c.hitter_team || "Unknown Team"})<br>
                       ${c.description || ""}<br><br>
                       Created: ${c.created_at}`
                    : `${renderInfo(c)}Created: ${c.created_at}`;
        const actionHtml = `
                <div class="actions">
                    <a href="${c.play}">
                        <button>Play</button>
                    </a>
                    ${hasPoseData
                        ? `<button type="button" onclick="openPoseAnimation(${c.id})">Pose Animation</button>`
                        : ""}
                    ${hasPoseData
                        ? `<button type="button" onclick="copyPoseData(${c.id})">Copy Pose Data</button>`
                        : ""}
                    ${hasPoseData
                        ? `<button type="button" style="background:#7a1f1f;color:#fff;" onclick="deletePoseData(${c.id})">Delete Pose Data</button>`
                        : ""}

                    <form method="post" action="${c.delete}"
                          onsubmit="return attachReturnURL(this);">
                        <input type="hidden" name="id" value="${c.id}">
                        <input type="hidden" name="sid" value="${sid}">
                        <input type="hidden" name="return" value="">
                        <button type="submit" style="background:#d33; color:white;">Delete</button>
                    </form>
                </div>`;
        html += `
        <div class="card-row"
             data-type="${c.type}"
             data-text="${text}"
             data-pitcher-team="${pitcher_team}"
             data-hitter-team="${hitter_team}"
             data-pitcher="${pitcher}"
             data-hitter="${hitter}">

            <div class="library-item">
                ${isCollapsibleType
                    ? `
                <details class="library-details">
                    <summary class="library-summary">
                        <b>${summaryTitle}</b> - <span class="library-summary-desc">${summaryDesc}</span>
                    </summary>
                    <div class="library-expanded">
                        <div class="library-thumb-wrap">
                            <img class="thumb" src="${c.thumbnail}">
                        </div>
                        <div class="info">
                            ${expandedInfoHtml}
                        </div>
                        ${actionHtml}
                    </div>
                </details>
                    `
                    : `
                <div class="library-thumb-wrap">
                    <img class="thumb" src="${c.thumbnail}">
                </div>

                <div class="info">
                    ${renderInfo(c)}
                    Created: ${c.created_at}
                </div>

                ${actionHtml}
                    `}

            </div>
        </div>`;
    });

    grid.innerHTML = html;
    rowNodes = Array.from(document.querySelectorAll(".card-row"));
}


// ------------------------------------------------------------
// FORMAT INFO
// ------------------------------------------------------------
function renderInfo(c) {

    if (c.type === "pitch") {
        return `<b>${c.pitcher_name}</b> (${c.team_name})<br>${c.description || ""}<br><br>`;
    }

    if (c.type === "swing") {
        const dur = (c.swing_duration_seconds != null && Number.isFinite(Number(c.swing_duration_seconds)))
            ? `${Number(c.swing_duration_seconds).toFixed(3)}s`
            : "n/a";
        return `<b>${c.hitter_name}</b> (${c.team_name})<br>${c.description || ""}<br>Swing Duration: ${dur}<br><br>`;
    }

    if (c.type === "matchup") {
        return `
            Pitcher: ${c.pitcher_name} (${c.pitcher_team})<br>
            Hitter: ${c.hitter_name} (${c.hitter_team})<br>
            ${c.description || ""}<br><br>
        `;
    }

    if (c.type === "multi") {
        return `
            Pitcher A: ${c.pitcherA_name} (${c.pitcherA_team})<br>
            Pitcher B: ${c.pitcherB_name} (${c.pitcherB_team})<br>
            Hitter: ${c.hitter_name} (${c.hitter_team})<br>
            ${c.description || ""}<br><br>
        `;
    }

    return "";
}


// ------------------------------------------------------------
// BUILD FILTER OPTIONS
// ------------------------------------------------------------
function rebuildFilterOptions(items) {

    const pitcherTeams = new Set();
    const hitterTeams  = new Set();
    const pitchers     = new Set();
    const hitters      = new Set();

    items.forEach(i => {

        if (i.type === "pitch" && i.team_name)
            pitcherTeams.add(i.team_name.toLowerCase());

        if (i.type === "swing" && i.team_name)
            hitterTeams.add(i.team_name.toLowerCase());

        if (i.type === "matchup") {
            if (i.pitcher_team) pitcherTeams.add(i.pitcher_team.toLowerCase());
            if (i.hitter_team)  hitterTeams.add(i.hitter_team.toLowerCase());
        }

        if (i.type === "multi") {
            if (i.pitcherA_team) pitcherTeams.add(i.pitcherA_team.toLowerCase());
            if (i.pitcherB_team) pitcherTeams.add(i.pitcherB_team.toLowerCase());
            if (i.hitter_team)   hitterTeams.add(i.hitter_team.toLowerCase());
        }

        if (i.pitcher_name)
            pitchers.add(i.pitcher_name.toLowerCase());

        if (i.hitter_name)
            hitters.add(i.hitter_name.toLowerCase());
    });

    fPitcherTeam.innerHTML = `<option value="">All</option>`;
    fHitterTeam.innerHTML  = `<option value="">All</option>`;
    fPitcher.innerHTML     = `<option value="">All</option>`;
    fHitter.innerHTML      = `<option value="">All</option>`;

    pitcherTeams.forEach(t => fPitcherTeam.innerHTML += `<option value="${t}">${t}</option>`);
    hitterTeams.forEach(t => fHitterTeam.innerHTML  += `<option value="${t}">${t}</option>`);
    pitchers.forEach(p => fPitcher.innerHTML        += `<option value="${p}">${p}</option>`);
    hitters.forEach(h => fHitter.innerHTML          += `<option value="${h}">${h}</option>`);

    // reapply saved filters (important after rebuild)
    fPitcherTeam.value = savedPitcherTeam;
    fHitterTeam.value  = savedHitterTeam;
    fPitcher.value     = savedPitcher;
    fHitter.value      = savedHitter;
}


// ------------------------------------------------------------
// APPLY FILTERS
// ------------------------------------------------------------
function applyFilters() {
    const type          = fType.value;
    const q             = fText.value.toLowerCase().trim();
    const pTeam         = fPitcherTeam.value;
    const hTeam         = fHitterTeam.value;
    const pitcher       = fPitcher.value;
    const hitter        = fHitter.value;

    rowNodes.forEach(r => {
        let ok = true;

        const rt       = r.dataset.type;
        const text     = r.dataset.text;
        const rPTeam   = r.dataset.pitcherTeam;
        const rHTeam   = r.dataset.hitterTeam;
        const rPitcher = r.dataset.pitcher;
        const rHitter  = r.dataset.hitter;

        if (type && rt !== type) ok = false;
        if (q && !text.includes(q)) ok = false;

        if (pTeam && !rPTeam.includes(pTeam)) ok = false;
        if (hTeam && !rHTeam.includes(hTeam)) ok = false;

        if (pitcher && rPitcher !== pitcher) ok = false;
        if (hitter  && rHitter  !== hitter) ok = false;

        r.style.display = ok ? "" : "none";
    });
}

function setAllVisibleCardDetails(openState) {
    const detailNodes = Array.from(document.querySelectorAll(".card-row details.library-details"));
    detailNodes.forEach(d => {
        const row = d.closest(".card-row");
        if (!row || row.style.display === "none") return;
        d.open = openState;
    });
}


// ------------------------------------------------------------
// LISTENERS
// ------------------------------------------------------------
[fText, fPitcherTeam, fHitterTeam, fPitcher, fHitter].forEach(el => {
    el.addEventListener("input", () => {
        applyFilters();
        updateURL();
    });
});

fType.addEventListener("change", () => {
    updateURL();
    loadData(fType.value);
});
expandSwingsBtn.addEventListener("click", () => setAllVisibleCardDetails(true));
collapseSwingsBtn.addEventListener("click", () => setAllVisibleCardDetails(false));


// ------------------------------------------------------------
// INITIAL LOAD
// ------------------------------------------------------------
loadData(savedType);


// ------------------------------------------------------------
// RETURN URL CAPTURE FOR DELETE FORMS
// ------------------------------------------------------------
function attachReturnURL(form) {
    form.return.value = window.location.pathname + window.location.search;
    return true;
}

async function copyPoseData(swingId) {
    try {
        const r = await fetch(`/swing/pose-data?id=${swingId}`);
        const data = await r.json();
        if (!r.ok || !data.ok || !data.pose_data) {
            alert(data && data.error ? data.error : "No pose data available for this swing.");
            return;
        }
        await navigator.clipboard.writeText(data.pose_data);
        alert("Pose data copied.");
    } catch (e) {
        alert("Failed to copy pose data.");
    }
}

async function deletePoseData(swingId) {
    if (!confirm("Delete pose data for this swing?")) return;
    try {
        const form = new FormData();
        form.append("id", String(swingId));
        const r = await fetch(`/swing/pose-data/delete`, { method: "POST", body: form });
        const data = await r.json();
        if (!r.ok || !data.ok) {
            alert(data && data.error ? data.error : "Delete failed.");
            return;
        }
        await loadData(fType.value);
    } catch (_) {
        alert("Delete failed.");
    }
}

function parseCSVLine(line) {
    const out = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === "\"") {
            if (inQuotes && line[i + 1] === "\"") {
                cur += "\"";
                i += 1;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (ch === "," && !inQuotes) {
            out.push(cur);
            cur = "";
        } else {
            cur += ch;
        }
    }
    out.push(cur);
    return out;
}

function parsePoseRows(csvText) {
    const lines = (csvText || "").split(/\r?\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return { rows: [], fps: 30 };
    const headers = parseCSVLine(lines[0]);
    const idx = {};
    headers.forEach((h, i) => { idx[h.trim()] = i; });
    const take = (cols, name) => {
        const i = idx[name];
        if (i == null || i >= cols.length || cols[i] === "") return null;
        const n = Number(cols[i]);
        return Number.isFinite(n) ? n : null;
    };
    const rows = [];
    let fps = 30;
    for (let li = 1; li < lines.length; li += 1) {
        const cols = parseCSVLine(lines[li]);
        const rowFps = take(cols, "fps");
        if (Number.isFinite(rowFps) && rowFps > 0) fps = rowFps;
        rows.push({
            frame: take(cols, "frame"),
            eventStart: take(cols, "event_swing_start") === 1,
            eventDecision: take(cols, "event_decision") === 1,
            eventContact: take(cols, "event_contact") === 1,
            nose: { x: take(cols, "nose_x"), y: take(cols, "nose_y"), conf: take(cols, "nose_conf") },
            shoulder1: { x: take(cols, "shoulder1_x"), y: take(cols, "shoulder1_y"), conf: take(cols, "shoulder1_conf") },
            shoulder2: { x: take(cols, "shoulder2_x"), y: take(cols, "shoulder2_y"), conf: take(cols, "shoulder2_conf") },
            elbow1: { x: take(cols, "elbow1_x"), y: take(cols, "elbow1_y"), conf: take(cols, "elbow1_conf") },
            elbow2: { x: take(cols, "elbow2_x"), y: take(cols, "elbow2_y"), conf: take(cols, "elbow2_conf") },
            wrist1: { x: take(cols, "wrist1_x"), y: take(cols, "wrist1_y"), conf: take(cols, "wrist1_conf") },
            wrist2: { x: take(cols, "wrist2_x"), y: take(cols, "wrist2_y"), conf: take(cols, "wrist2_conf") },
            hip1: { x: take(cols, "hip1_x"), y: take(cols, "hip1_y"), conf: take(cols, "hip1_conf") },
            hip2: { x: take(cols, "hip2_x"), y: take(cols, "hip2_y"), conf: take(cols, "hip2_conf") },
            knee1: { x: take(cols, "knee1_x"), y: take(cols, "knee1_y"), conf: take(cols, "knee1_conf") },
            knee2: { x: take(cols, "knee2_x"), y: take(cols, "knee2_y"), conf: take(cols, "knee2_conf") },
            ankle1: { x: take(cols, "ankle1_x"), y: take(cols, "ankle1_y"), conf: take(cols, "ankle1_conf") },
            ankle2: { x: take(cols, "ankle2_x"), y: take(cols, "ankle2_y"), conf: take(cols, "ankle2_conf") },
        });
    }
    return { rows, fps };
}

function posePointDelta(a, b) {
    if (!a || !b) return null;
    if (!Number.isFinite(a.x) || !Number.isFinite(a.y) || !Number.isFinite(b.x) || !Number.isFinite(b.y)) return null;
    return Math.hypot(b.x - a.x, b.y - a.y);
}

function buildPoseChangeSeries(rows) {
    const n = rows ? rows.length : 0;
    const make = () => new Array(n).fill(0);
    const out = {
        hands: make(),
        shoulders: make(),
        hips: make(),
        knees: make(),
        feet: make(),
    };
    if (!rows || n < 2) return out;
    for (let i = 1; i < n; i += 1) {
        const prev = rows[i - 1];
        const curr = rows[i];
        const handVals = [posePointDelta(prev.wrist1, curr.wrist1), posePointDelta(prev.wrist2, curr.wrist2)].filter(Number.isFinite);
        const shoulderVals = [posePointDelta(prev.shoulder1, curr.shoulder1), posePointDelta(prev.shoulder2, curr.shoulder2)].filter(Number.isFinite);
        const hipVals = [posePointDelta(prev.hip1, curr.hip1), posePointDelta(prev.hip2, curr.hip2)].filter(Number.isFinite);
        const kneeVals = [posePointDelta(prev.knee1, curr.knee1), posePointDelta(prev.knee2, curr.knee2)].filter(Number.isFinite);
        const footVals = [posePointDelta(prev.ankle1, curr.ankle1), posePointDelta(prev.ankle2, curr.ankle2)].filter(Number.isFinite);
        out.hands[i] = handVals.length ? Math.max(...handVals) : 0;
        out.shoulders[i] = shoulderVals.length ? Math.max(...shoulderVals) : 0;
        out.hips[i] = hipVals.length ? Math.max(...hipVals) : 0;
        out.knees[i] = kneeVals.length ? Math.max(...kneeVals) : 0;
        out.feet[i] = footVals.length ? Math.max(...footVals) : 0;
    }
    return out;
}

function drawPoseChangeChart(selectedIdx) {
    if (!poseChangeCtx || !poseChangeChart) return;
    const W = poseChangeChart.width;
    const H = poseChangeChart.height;
    poseChangeCtx.fillStyle = "#0f1115";
    poseChangeCtx.fillRect(0, 0, W, H);
    if (!poseChangeSeries || !poseAnimRows.length) {
        poseChangeCtx.fillStyle = "#888";
        poseChangeCtx.font = "14px monospace";
        poseChangeCtx.fillText("No pose change chart available.", 18, 26);
        return;
    }
    const seriesDefs = [
        { key: "hands", color: "#ff8a65", label: "Hands" },
        { key: "shoulders", color: "#4fc3f7", label: "Shoulders" },
        { key: "hips", color: "#81c784", label: "Hips" },
        { key: "knees", color: "#ffd54f", label: "Knees" },
        { key: "feet", color: "#ba68c8", label: "Feet" },
    ];
    const padL = 46, padR = 18, padT = 26, padB = 28;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = Math.max(1, poseAnimRows.length);
    const xScale = plotW / Math.max(1, n - 1);
    const vals = [];
    seriesDefs.forEach(({ key }) => {
        (poseChangeSeries[key] || []).forEach((v) => {
            if (Number.isFinite(v)) vals.push(v);
        });
    });
    let maxV = vals.length ? Math.max(...vals) : 0.01;
    if (!Number.isFinite(maxV) || maxV <= 0) maxV = 0.01;
    const yScale = plotH / maxV;

    poseChangeCtx.strokeStyle = "#39424e";
    poseChangeCtx.lineWidth = 1;
    poseChangeCtx.beginPath();
    poseChangeCtx.moveTo(padL, padT);
    poseChangeCtx.lineTo(padL, H - padB);
    poseChangeCtx.lineTo(W - padR, H - padB);
    poseChangeCtx.stroke();

    for (let yi = 0; yi <= 4; yi += 1) {
        const y = padT + (yi / 4) * plotH;
        const v = maxV * (1 - yi / 4);
        poseChangeCtx.strokeStyle = "#20262f";
        poseChangeCtx.beginPath();
        poseChangeCtx.moveTo(padL, y);
        poseChangeCtx.lineTo(W - padR, y);
        poseChangeCtx.stroke();
        poseChangeCtx.fillStyle = "#b8c0cc";
        poseChangeCtx.font = "11px monospace";
        poseChangeCtx.textAlign = "right";
        poseChangeCtx.fillText(v.toFixed(3), padL - 6, y + 4);
    }
    poseChangeCtx.textAlign = "left";

    seriesDefs.forEach(({ key, color }) => {
        const series = poseChangeSeries[key] || [];
        poseChangeCtx.strokeStyle = color;
        poseChangeCtx.lineWidth = 2;
        poseChangeCtx.beginPath();
        let started = false;
        for (let i = 0; i < series.length; i += 1) {
            const v = series[i];
            if (!Number.isFinite(v)) continue;
            const x = padL + i * xScale;
            const y = padT + plotH - (v * yScale);
            if (!started) {
                poseChangeCtx.moveTo(x, y);
                started = true;
            } else {
                poseChangeCtx.lineTo(x, y);
            }
        }
        poseChangeCtx.stroke();
    });

    if (Number.isFinite(selectedIdx)) {
        const x = padL + Math.max(0, Math.min(n - 1, selectedIdx)) * xScale;
        poseChangeCtx.strokeStyle = "#ffffff";
        poseChangeCtx.lineWidth = 1.5;
        poseChangeCtx.beginPath();
        poseChangeCtx.moveTo(x, padT);
        poseChangeCtx.lineTo(x, H - padB);
        poseChangeCtx.stroke();
    }

    poseChangeCtx.fillStyle = "#dce3ea";
    poseChangeCtx.font = "12px monospace";
    poseChangeCtx.fillText("Pose Point Changes (frame-to-frame movement)", 8, 16);
    let legendX = W - 410;
    seriesDefs.forEach(({ color, label }) => {
        poseChangeCtx.strokeStyle = color;
        poseChangeCtx.lineWidth = 2;
        poseChangeCtx.beginPath();
        poseChangeCtx.moveTo(legendX, 14);
        poseChangeCtx.lineTo(legendX + 18, 14);
        poseChangeCtx.stroke();
        poseChangeCtx.fillStyle = "#dce3ea";
        poseChangeCtx.fillText(label, legendX + 24, 18);
        legendX += 78;
    });
}

function drawPoseFrame(row, idx, total) {
    const w = poseCanvas.width;
    const h = poseCanvas.height;
    poseCtx.fillStyle = "black";
    poseCtx.fillRect(0, 0, w, h);
    if (!row) return;
    const x = (v) => Math.round(Math.max(0, Math.min(1, Number(v))) * w);
    const y = (v) => Math.round(Math.max(0, Math.min(1, Number(v))) * h);
    const ok = (p) => p && Number.isFinite(p.x) && Number.isFinite(p.y) && (p.conf == null || p.conf >= 0.1);

    poseCtx.lineWidth = 5;
    poseCtx.strokeStyle = "#66c2ff";
    poseCtx.beginPath();
    for (const [aName, bName] of POSE_CONNECTIONS) {
        const a = row[aName];
        const b = row[bName];
        if (!ok(a) || !ok(b)) continue;
        poseCtx.moveTo(x(a.x), y(a.y));
        poseCtx.lineTo(x(b.x), y(b.y));
    }
    poseCtx.stroke();

    const points = ["nose", "shoulder1", "shoulder2", "elbow1", "elbow2", "wrist1", "wrist2", "hip1", "hip2", "knee1", "knee2", "ankle1", "ankle2"];
    poseCtx.fillStyle = "#ffffff";
    for (const name of points) {
        const p = row[name];
        if (!ok(p)) continue;
        poseCtx.beginPath();
        poseCtx.arc(x(p.x), y(p.y), 4, 0, Math.PI * 2);
        poseCtx.fill();
    }

    poseCtx.fillStyle = "rgba(0,0,0,0.6)";
    poseCtx.fillRect(10, 10, 300, 66);
    poseCtx.fillStyle = "#fff";
    poseCtx.font = "16px monospace";
    poseCtx.fillText(`Frame: ${idx + 1}/${total}`, 18, 32);
    const tags = [];
    if (row.eventStart) tags.push("START");
    if (row.eventDecision) tags.push("DECISION");
    if (row.eventContact) tags.push("CONTACT");
    poseCtx.fillText(tags.length ? tags.join(" | ") : "-", 18, 56);
}

function formatPoseSpeed(speed) {
    const n = Number(speed || 0);
    return `${n.toFixed(2)}x`;
}

function updatePoseStatus(prefix = null) {
    if (!poseAnimRows.length) {
        poseStatus.textContent = prefix || "No pose data loaded.";
        return;
    }
    const frameInfo = `Frame ${poseAnimIndex + 1}/${poseAnimRows.length}`;
    const speedInfo = formatPoseSpeed(poseAnimSpeed);
    if (prefix) {
        poseStatus.textContent = `${prefix} | ${frameInfo} | ${speedInfo}`;
        return;
    }
    poseStatus.textContent = `${poseAnimPlaying ? "Playing" : "Paused"} | ${frameInfo} | ${speedInfo}`;
}

function syncPoseTimelineUI() {
    if (!poseTimelineSlider) return;
    poseTimelineSlider.max = String(Math.max(0, poseAnimRows.length - 1));
    poseTimelineSlider.value = String(Math.max(0, Math.min(poseAnimRows.length - 1, poseAnimIndex)));
}

function syncPoseSpeedUI() {
    if (poseSpeedValue) poseSpeedValue.textContent = formatPoseSpeed(poseAnimSpeed);
    poseSpeedButtons.forEach((btn) => {
        const speed = Number(btn.dataset.speed || 1);
        const active = Math.abs(speed - poseAnimSpeed) < 0.001;
        btn.style.background = active ? "#2c6fbb" : "";
        btn.style.color = active ? "#fff" : "";
        btn.style.borderColor = active ? "#2c6fbb" : "";
    });
}

function setPoseFrame(nextIndex) {
    if (!poseAnimRows.length) return;
    poseAnimIndex = Math.max(0, Math.min(poseAnimRows.length - 1, Math.round(nextIndex)));
    drawPoseFrame(poseAnimRows[poseAnimIndex], poseAnimIndex, poseAnimRows.length);
    drawPoseChangeChart(poseAnimIndex);
    syncPoseTimelineUI();
    updatePoseStatus();
}

function stopPoseAnimation() {
    poseAnimPlaying = false;
    if (poseAnimRaf) cancelAnimationFrame(poseAnimRaf);
    poseAnimRaf = null;
    poseAnimLastTs = 0;
    poseAnimFrameCarry = 0;
    updatePoseStatus();
}

function poseTick(ts) {
    if (!poseAnimPlaying || !poseAnimRows.length) return;
    if (!poseAnimLastTs) poseAnimLastTs = ts;
    const elapsedMs = ts - poseAnimLastTs;
    poseAnimLastTs = ts;
    if (Math.abs(poseAnimSpeed) < 0.001) {
        updatePoseStatus();
        poseAnimRaf = requestAnimationFrame(poseTick);
        return;
    }
    const framesToAdvance = (elapsedMs / 1000) * Math.max(1, poseAnimFps) * poseAnimSpeed;
    poseAnimFrameCarry += framesToAdvance;
    let wholeFrames = 0;
    if (poseAnimFrameCarry >= 1) {
        wholeFrames = Math.floor(poseAnimFrameCarry);
    } else if (poseAnimFrameCarry <= -1) {
        wholeFrames = Math.ceil(poseAnimFrameCarry);
    }
    if (wholeFrames !== 0) {
        poseAnimFrameCarry -= wholeFrames;
        poseAnimIndex = (((poseAnimIndex + wholeFrames) % poseAnimRows.length) + poseAnimRows.length) % poseAnimRows.length;
        setPoseFrame(poseAnimIndex);
    }
    poseAnimRaf = requestAnimationFrame(poseTick);
}

function startPoseAnimation() {
    if (!poseAnimRows.length) return;
    poseAnimPlaying = true;
    poseAnimLastTs = 0;
    if (!poseAnimRaf) poseAnimRaf = requestAnimationFrame(poseTick);
    updatePoseStatus();
}

async function openPoseAnimation(swingId) {
    try {
        poseStatus.textContent = "Loading pose data...";
        poseModal.style.display = "flex";
        const r = await fetch(`/swing/pose-data?id=${swingId}`);
        const data = await r.json();
        if (!r.ok || !data.ok || !data.pose_data) {
            poseStatus.textContent = "No pose data available.";
            return;
        }
        const parsed = parsePoseRows(data.pose_data);
        if (!parsed.rows.length) {
            poseStatus.textContent = "Pose data was empty.";
            return;
        }
        poseAnimRows = parsed.rows;
        poseChangeSeries = buildPoseChangeSeries(parsed.rows);
        poseAnimFps = parsed.fps || 30;
        poseAnimIndex = 0;
        poseAnimSpeed = 1;
        poseAnimFrameCarry = 0;
        const item = rawItems.find((x) => Number(x.id) === Number(swingId));
        poseModalTitle.textContent = `Pose Animation${item && item.hitter_name ? ` - ${item.hitter_name}` : ""}`;
        setPoseFrame(0);
        syncPoseSpeedUI();
        updatePoseStatus(`Loaded ${poseAnimRows.length} frames @ ${poseAnimFps.toFixed(2)} fps`);
        startPoseAnimation();
    } catch (_) {
        poseStatus.textContent = "Failed to load pose data.";
    }
}

posePlayBtn.onclick = () => startPoseAnimation();
posePauseBtn.onclick = () => stopPoseAnimation();
if (poseTimelineSlider) {
    poseTimelineSlider.oninput = () => {
        const next = Number(poseTimelineSlider.value || 0);
        stopPoseAnimation();
        setPoseFrame(next);
    };
}
poseSpeedButtons.forEach((btn) => {
    btn.onclick = () => {
        const next = Number(btn.dataset.speed || 1);
        poseAnimSpeed = Number.isFinite(next) ? next : 1;
        syncPoseSpeedUI();
        if (poseAnimRows.length) {
            updatePoseStatus();
        }
    };
});
poseCloseBtn.onclick = () => {
    stopPoseAnimation();
    poseChangeSeries = null;
    poseModal.style.display = "none";
};
poseModal.onclick = (ev) => {
    if (ev.target === poseModal) {
        stopPoseAnimation();
        poseChangeSeries = null;
        poseModal.style.display = "none";
    }
};
</script>
