{% extends 'base.html' %}
{% block content %}

<h2 style="margin-bottom:20px;">Create Matchup</h2>

<div id="status" style="margin-bottom:10px; color:#ccc; font-weight:bold;">
    Loading FFmpeg…
</div>

<!-- PROGRESS BAR (ADDED) -->
<div id="progress-container" style="margin-top:15px; width:360px; display:none;">
    <div style="background:#333; width:100%; height:14px; border-radius:4px; overflow:hidden;">
        <div id="progress-bar" style="height:100%; width:0%; background:#ffdd00;"></div>
    </div>
    <div id="progress-label" style="margin-top:6px; font-size:13px; color:#ccc;">
        Working…
    </div>
</div>

<form id="matchupForm">
    <input type="hidden" id="sid" value="{{ sid }}">

    <div style="display:flex; gap:60px; align-items:flex-start;">

        <!-- COLUMN 1: PITCH -->
        <div style="width:300px;">
            <h3>Pitch Selection</h3>

            <label>Pitch Team</label>
            <select id="pitch_team" style="width:100%; padding:8px; margin:8px 0;">
                <option value="">Select Team</option>
                {% for t in teams %}
                    <option value="{{ t.id or t[0] }}">{{ t.name or t[1] }}</option>
                {% endfor %}
            </select>

            <label>Pitcher</label>
            <select id="pitch_pitcher" style="width:100%; padding:8px; margin:8px 0;"></select>

            <label>Pitch Clip</label>
            <select id="pitch_clip" style="width:100%; padding:8px; margin:8px 0;"></select>

            <h3>Matchup Description</h3>

            <input type="text" id="desc" placeholder="Description (optional)"
                   style="width:100%; padding:10px; margin:8px 0;">

            <button type="submit">
                Create Matchup
            </button>
        </div>

        <!-- COLUMN 2: SWING -->
        <div style="width:300px;">
            <h3>Swing Selection</h3>

            <label>Swing Team</label>
            <select id="swing_team" style="width:100%; padding:8px; margin:8px 0;">
                <option value="">Select Team</option>
                {% for t in teams %}
                    <option value="{{ t.id or t[0] }}">{{ t.name or t[1] }}</option>
                {% endfor %}
            </select>

            <label>Hitter</label>
            <select id="swing_hitter" style="width:100%; padding:8px; margin:8px 0;"></select>

            <label>Swing Clip</label>
            <select id="swing_clip" style="width:100%; padding:8px; margin:8px 0;"></select>
        </div>

    </div>
</form>



<!-- FFmpeg override -->
<script>

function showProgress() {
    document.getElementById("progress-container").style.display = "block";
}

function updateProgress(pct, msg = "") {
    document.getElementById("progress-bar").style.width = pct + "%";
    if (msg) document.getElementById("progress-label").innerText = msg;
}

window.FFMPEG_CORE_PATH   = "/static/js/ffmpeg/ffmpeg-core.js";
window.FFMPEG_WASM_PATH   = "/static/js/ffmpeg/ffmpeg-core.wasm";
window.FFMPEG_WORKER_PATH = "/static/js/ffmpeg/ffmpeg-core.worker.js";

window.FFmpeg = window.FFmpeg || {};

window.FFmpeg.getCreateFFmpegCore = () => ({
    mainScriptUrlOrBlob: window.FFMPEG_CORE_PATH,
    locateFile: (p) => {
        if (p.endsWith(".wasm"))      return window.FFMPEG_WASM_PATH;
        if (p.endsWith(".worker.js")) return window.FFMPEG_WORKER_PATH;
        return p;
    }
});
</script>

    async function extractFramesFromVideo(arrayBuffer) {
        const blob = new Blob([arrayBuffer], { type: "video/mp4" });
        const url = URL.createObjectURL(blob);
        const video = document.createElement("video");
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";

        const captureCanvas = document.createElement("canvas");
        const captureVideoFrame = async () => {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return null;
            if (captureCanvas.width !== vw || captureCanvas.height !== vh) {
                captureCanvas.width = vw;
                captureCanvas.height = vh;
            }
            const ctx = captureCanvas.getContext("2d");
            ctx.drawImage(video, 0, 0, vw, vh);
            return createImageBitmap(captureCanvas);
        };

        const appendGuaranteedTailFrame = async (frames) => {
            try {
                const dur = Number(video.duration);
                if (!Number.isFinite(dur) || dur <= 0) return frames;
                await new Promise((resolve) => {
                    const onSeeked = () => resolve();
                    video.addEventListener("seeked", onSeeked, { once: true });
                    video.currentTime = Math.max(0, dur - 0.001);
                });
                const tail = await captureVideoFrame();
                if (tail) frames.push(tail);
            } catch (_) {
                // Best effort only; keep decoded frames if seek fails on some browsers.
            }
            return frames;
        };

        // Primary path: MediaStreamTrackProcessor frame-by-frame decode (more complete).
        if (typeof MediaStreamTrackProcessor !== "undefined") {
            await video.play().catch(()=>{});
            const stream = video.captureStream();
            const track = stream.getVideoTracks()[0];
            if (track) {
                const reader = new MediaStreamTrackProcessor(track).readable.getReader();
                const frames = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const bmp = await createImageBitmap(value);
                    value.close();
                    frames.push(bmp);
                }
                await appendGuaranteedTailFrame(frames);
                video.pause();
                video.src = "";
                video.load();
                URL.revokeObjectURL(url);
                return frames;
            }
        }

        // Fallback: requestVideoFrameCallback
        return new Promise(async (resolve) => {
            await video.play().catch(()=>{});
            const frames = [];
            async function captureFrame() {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                if (vw && vh) {
                    const bmp = await captureVideoFrame();
                    if (bmp) frames.push(bmp);
                }
                video.requestVideoFrameCallback(captureFrame);
            }
            video.requestVideoFrameCallback(captureFrame);
            video.onended = () => {
                appendGuaranteedTailFrame(frames).finally(() => {
                    video.pause();
                    video.src = "";
                    video.load();
                    URL.revokeObjectURL(url);
                    resolve(frames);
                });
            };
        });
    }

    function releaseFrameSequence(frames) {
        if (!frames || !frames.length) return;
        for (const frame of frames) {
            try {
                if (frame && typeof frame.close === "function") frame.close();
            } catch (_) {}
        }
        frames.length = 0;
    }

        function letterbox(frame, boxW, boxH) {
            const srcW = frame.width;

            let drawW, drawH;

        function compose(pitch, swing, tintColor = null, overlayLabel = "") {

            const ctx = c.getContext("2d");
            ctx.drawImage(pitchBox, 0, 0);
            ctx.drawImage(swingBox, 640, 0);

            if (overlayLabel) {

                ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
                ctx.fillRect(470, 652, 340, 46);

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(label, 640, 675);
            }
        
            return c;
        }



        const yellow = [255,255,0,0.25];
        const green  = [0,255,0,0.25];

        // PHASES:
        for (let i = 0; i < padCount; i++)
            outFrames.push(compose(getPitch(i), swingF[0]));

        for (let i = 0; i < freeze; i++)
            outFrames.push(compose(getPitch(padCount), swingF[0], yellow));

        for (let i = padCount + 1; i < decisionGlobal; i++)
            outFrames.push(compose(getPitch(i), getSwing(i)));

        for (let i = 0; i < freeze; i++)
            outFrames.push(compose(getPitch(decisionGlobal), getSwing(decisionGlobal), green));

        for (let i = decisionGlobal + 1; i <= contact; i++)

        // --------------------------------------------------------
        // End sequence:

        for (let i = 0; i < END_CONTACT_FREEZE; i++) {
            outFrames.push(compose(contactPitch, contactSwing, null, "Contact"));
        }

        const END_FIRST_MOVE_FREEZE = 90;

        //------------------------------------------------------------

        const titleFrames = [];
        const TITLE_W = 1280;

        const swingDuration = Number.isFinite(Number(meta.swing_seconds))
            ? Number(meta.swing_seconds).toFixed(2)

        const hitterName    = swHitter.options[swHitter.selectedIndex].text;

        for (let i = 0; i < TITLE_COUNT; i++) {

            : (swingFrameCount / commonFps).toFixed(2);
        const hitterName = swHitter.options[swHitter.selectedIndex].text;
        const pitcherName = ptPitcher.options[ptPitcher.selectedIndex].text;

        function framesToCloneSeconds(frameCount) {
            return Math.max(0, (frameCount - 1) / commonFps);
        }

        function buildLabelPng(text, bg = "rgba(0,0,0,0.72)") {
            const c = document.createElement("canvas");
            c.width = 420;
            c.height = 72;
            const ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 34px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(String(text), c.width / 2, c.height / 2);
            return new Promise((resolve, reject) => {
                c.toBlob(async (blob) => {
                    if (!blob) {
                        reject(new Error("label png failed"));
                        return;
                    }
                    resolve(new Uint8Array(await blob.arrayBuffer()));
                }, "image/png");
            });
        }

        async function writeLabel(name, text) {
            const path = `${runDir}/${name}.png`;
            ffmpeg.FS("writeFile", path, await buildLabelPng(text));
            return path;
        }

        const firstMoveLabel = await writeLabel("label_first_move", "First Move");
        const decisionLabel = await writeLabel("label_decision", "Decision");
        const contactLabel = await writeLabel("label_contact", "Contact");

        function sideChain(inputIndex, startFrame, endFrame, freezeFrames = 0, tint = null) {
            const endFrameExclusive = Math.max(startFrame + 1, endFrame);
            let chain = `[${inputIndex}:v]trim=start_frame=${startFrame}:end_frame=${endFrameExclusive},setpts=PTS-STARTPTS`;
            if (freezeFrames > 0) {
                chain += `,tpad=stop_mode=clone:stop_duration=${framesToCloneSeconds(freezeFrames)}`;
            }
            if (tint) {
                chain += `,drawbox=x=0:y=0:w=iw:h=ih:color=${tint}@0.25:t=fill`;
            }
            chain += `,scale=${HALF_W}:${OUTPUT_H}:force_original_aspect_ratio=decrease,pad=${HALF_W}:${OUTPUT_H}:(ow-iw)/2:(oh-ih)/2:black`;
            return chain;
        }

        async function buildStackSegment(name, pitchSpec, swingSpec, labelPath = null) {
            const outputPath = `${runDir}/${name}.mp4`;
            const args = [
                "-y",
                "-i", pitchPath,
                "-i", swingPath,
            ];
            if (labelPath) {
                args.push("-loop", "1", "-i", labelPath);
            }
            const filters = [
                `${sideChain(0, pitchSpec.start, pitchSpec.end, pitchSpec.freezeFrames || 0, pitchSpec.tint || null)}[left]`,
                `${sideChain(1, swingSpec.start, swingSpec.end, swingSpec.freezeFrames || 0, swingSpec.tint || null)}[right]`,
                `[left][right]hstack=inputs=2[stacked]`,
            ];
            let finalMap = "[stacked]";
            if (labelPath) {
                filters.push(`[stacked][2:v]overlay=(W-w)/2:H-h-22:shortest=1[labeled]`);
                finalMap = "[labeled]";
            }
            args.push(
                "-filter_complex", filters.join(";"),
                "-map", finalMap,
                "-r", String(commonFps),
                "-c:v", "libx264",
                "-preset", "veryfast",
                "-crf", "23",
                "-pix_fmt", "yuv420p",
                "-movflags", "+faststart",
                outputPath
            );
            await ffmpeg.run(...args);
            segmentPaths.push(outputPath);
        }

        async function buildTitleSegment() {
            const c = document.createElement("canvas");
            c.width = OUTPUT_W;
            c.height = OUTPUT_H;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, OUTPUT_W, OUTPUT_H);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "48px Arial";
            ctx.fillText(desc || "Matchup", OUTPUT_W / 2, 180);
            ctx.font = "42px Arial";
            ctx.fillText(`${hitterName} vs ${pitcherName}`, OUTPUT_W / 2, 260);
            ctx.font = "36px Arial";
            ctx.fillText(`Swing Duration: ${swingDuration}s`, OUTPUT_W / 2, 340);
            ctx.font = "32px Arial";
            ctx.fillText(matchupDate, OUTPUT_W / 2, 420);
            const blob = await new Promise((resolve) => c.toBlob(resolve, "image/png"));
            const titlePng = `${runDir}/title.png`;
            ffmpeg.FS("writeFile", titlePng, new Uint8Array(await blob.arrayBuffer()));
            await ffmpeg.run(
                "-y",
                "-loop", "1",
                "-i", titlePng,
                "-t", String(TITLE_FRAMES / commonFps),
                "-r", String(commonFps),
                "-c:v", "libx264",
                "-preset", "veryfast",
                "-crf", "23",
                "-pix_fmt", "yuv420p",
                "-movflags", "+faststart",
                titlePath
            );
            segmentPaths.push(titlePath);
            try { ffmpeg.FS("unlink", titlePng); } catch (_) {}
        }

        updateProgress(22, "Building title segment...");
        await buildTitleSegment();

        if (padCount > 0) {
            updateProgress(30, "Building lead-in segment...");
            await buildStackSegment(
                "seg_01_leadin",
                { start: 0, end: padCount },
                { start: 0, end: 1, freezeFrames: padCount }
            );
        }

        updateProgress(38, "Building first move segment...");
        await buildStackSegment(
            "seg_02_first_move",
            { start: padCount, end: padCount + 1, freezeFrames: FREEZE_FRAMES, tint: "yellow" },
            { start: 0, end: 1, freezeFrames: FREEZE_FRAMES, tint: "yellow" },
            firstMoveLabel
        );

        if (decisionGlobal > padCount + 1) {
            updateProgress(46, "Building start-to-decision segment...");
            await buildStackSegment(
                "seg_03_motion_start_decision",
                { start: padCount + 1, end: decisionGlobal },
                { start: 1, end: decisionLocal }
            );
        }

        updateProgress(54, "Building decision segment...");
        await buildStackSegment(
            "seg_04_decision",
            { start: decisionGlobal, end: decisionGlobal + 1, freezeFrames: FREEZE_FRAMES, tint: "green" },
            { start: decisionLocal, end: decisionLocal + 1, freezeFrames: FREEZE_FRAMES, tint: "green" },
            decisionLabel
        );

        if (contactGlobal > decisionGlobal + 1) {
            updateProgress(62, "Building decision-to-contact segment...");
            await buildStackSegment(
                "seg_05_motion_decision_contact",
                { start: decisionGlobal + 1, end: contactGlobal + 1 },
                { start: decisionLocal + 1, end: swingFrameCount }
            );
        }

        updateProgress(70, "Building contact segment...");
        await buildStackSegment(
            "seg_06_contact",
            { start: contactGlobal, end: contactGlobal + 1, freezeFrames: FREEZE_FRAMES },
            { start: swingLastIdx, end: swingLastIdx + 1, freezeFrames: FREEZE_FRAMES },
            contactLabel
        );

        updateProgress(78, "Building ending decision segment...");
        await buildStackSegment(
            "seg_07_decision_end",
            { start: decisionGlobal, end: decisionGlobal + 1, freezeFrames: END_DECISION_FREEZE_FRAMES, tint: "green" },
            { start: decisionLocal, end: decisionLocal + 1, freezeFrames: END_DECISION_FREEZE_FRAMES, tint: "green" },
            decisionLabel
        );

        const concatList = `${runDir}/concat.txt`;
        const concatBody = segmentPaths.map((p) => `file '${p.split("/").pop()}'`).join("\n");
        ffmpeg.FS("writeFile", concatList, new TextEncoder().encode(concatBody));

        updateProgress(86, "Concatenating matchup...");
        const outputPath = `${runDir}/matchup.mp4`;
        await ffmpeg.run(
            "-y",
            "-f", "concat",
            "-safe", "0",
            "-i", concatList,
            "-c", "copy",
            outputPath
        );

        const out = ffmpeg.FS("readFile", outputPath);
        const blob = new Blob([out], { type: "video/mp4" });

        updateProgress(94, "Uploading...");

        const fd = new FormData();
        fd.append("sid", document.getElementById("sid").value);
        fd.append("pitch_id", pitch_id);
        fd.append("swing_id", swing_id);
        fd.append("description", desc);
        fd.append("file", new File([blob], "matchup.mp4", { type: "video/mp4" }));

        const resp = await fetch("/matchup/create", {
            method: "POST",
            body: fd
        });

        if (!resp.ok) {
            log("Upload failed.");
            return;
        }

        const data = await resp.json();
        const newId = data.id;

        try { ffmpeg.FS("unlink", concatList); } catch (_) {}
        try { ffmpeg.FS("unlink", outputPath); } catch (_) {}
        for (const p of segmentPaths) {
            try { ffmpeg.FS("unlink", p); } catch (_) {}
        }
        for (const p of [firstMoveLabel, decisionLabel, contactLabel, pitchPath, swingPath]) {
            try { ffmpeg.FS("unlink", p); } catch (_) {}
        }
        try { ffmpeg.FS("rmdir", runDir); } catch (_) {}

        updateProgress(100, "Done!");

        window.location.href =
            `/play/matchup?id=${newId}&sid=${document.getElementById("sid").value}`;
    };

    document.getElementById("matchupForm").onsubmit = async e => {
        e.preventDefault();

        showProgress();
        updateProgress(8, "Getting your matchup ready...");
        log("Getting your matchup ready...");

        const pitch_id = ptClip.value;
        const swing_id = swClip.value;
        const desc = (document.getElementById("desc").value || "Matchup").replace(/"/g, "'");
        updateProgress(24, "Sending the matchup request...");

        const fd = new FormData();
        fd.append("sid", document.getElementById("sid").value);
        fd.append("pitch_id", pitch_id);
        fd.append("swing_id", swing_id);
        fd.append("description", desc);

        updateProgress(52, "Building your matchup...");

        const resp = await fetch("/matchup/create", {
            method: "POST",
            body: fd
        });

        if (!resp.ok) {
            log("Could not build matchup.");
            updateProgress(0, "Could not build matchup.");
            return;
        }

        updateProgress(90, "Saving your matchup...");

        const data = await resp.json();
        const newId = data.id;

        updateProgress(100, "Done!");

        window.location.href =
            `/play/matchup?id=${newId}&sid=${document.getElementById("sid").value}`;
    };

});
</script>
