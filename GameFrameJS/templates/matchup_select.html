{% extends 'base.html' %}
{% block content %}

<div id="status" style="margin-bottom:10px; color:#ccc; font-weight:bold;">
    Loading FFmpeg…
</div>

<!-- PROGRESS BAR (ADDED) -->
<div id="progress-container" style="margin-top:15px; width:360px; display:none;">
    <div style="background:#333; width:100%; height:14px; border-radius:4px; overflow:hidden;">
        <div id="progress-bar" style="height:100%; width:0%; background:#ffdd00;"></div>
    </div>
    <div id="progress-label" style="margin-top:6px; font-size:13px; color:#ccc;">
        Working…
    </div>
</div>

<form id="matchupForm">
    <input type="hidden" id="sid" value="{{ sid }}">
    <header class="matchup-wizard-heading">
        <h2 id="matchup-step-title" tabindex="-1">Choose a pitch</h2>
        <span id="matchup-step-count">Step 1 of 3</span>
    </header>

    <div class="matchup-selection-columns">

        <!-- COLUMN 1: PITCH -->
        <div data-matchup-step="0" class="matchup-choice-step">
            <h3>Pitch Selection</h3>
            <div class="matchup-choice-fields">
            <label for="pitch_team">Team</label>
            <select id="pitch_team" style="width:100%; padding:8px; margin:8px 0;">
                <option value="">Select Team</option>
                {% for t in teams %}
                    <option value="{{ t.id or t[0] }}">{{ t.name or t[1] }}</option>
                {% endfor %}
            </select>

            <label for="pitch_pitcher">Pitcher</label>
            <select id="pitch_pitcher" style="width:100%; padding:8px; margin:8px 0;"></select>

            <label for="pitch_clip">Pitch</label>
            <select id="pitch_clip" style="width:100%; padding:8px; margin:8px 0;"></select>
            </div>
            <div id="pitch_clip_preview" class="matchup-clip-preview" aria-live="polite"></div>

        </div>

        <!-- COLUMN 2: SWING -->
        <div data-matchup-step="1" class="matchup-choice-step" hidden>
            <h3>Swing Selection</h3>
            <div class="matchup-choice-fields">
            <label for="swing_team">Team</label>
            <select id="swing_team" style="width:100%; padding:8px; margin:8px 0;">
                <option value="">Select Team</option>
                {% for t in teams %}
                    <option value="{{ t.id or t[0] }}">{{ t.name or t[1] }}</option>
                {% endfor %}
            </select>

            <label for="swing_hitter">Hitter</label>
            <select id="swing_hitter" style="width:100%; padding:8px; margin:8px 0;"></select>

            <label for="swing_clip">Swing</label>
            <select id="swing_clip" style="width:100%; padding:8px; margin:8px 0;"></select>
            </div>
            <div id="swing_clip_preview" class="matchup-clip-preview" aria-live="polite"></div>
        </div>

    </div>
    <section data-matchup-step="2" hidden>
        <div id="matchup-review-clips"></div>
        <label for="desc">Description (optional)</label>
        <input type="text" id="desc" style="width:100%;padding:10px;margin:8px 0;">
    </section>
    <p id="matchup-wizard-error" role="alert" hidden></p>
    <div class="matchup-wizard-actions">
        <button id="matchup-back" type="button" hidden>Back</button>
        <button id="matchup-next" type="button">Continue</button>
        <button id="matchup-create" type="submit" hidden>Create Matchup</button>
    </div>
</form>

<style>
.matchup-selection-columns { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start; }
#matchupForm { display:block!important;max-width:760px; margin:0 auto; }
#matchupForm [hidden] { display:none !important; }
.matchup-wizard-heading,.matchup-wizard-actions { display:flex;align-items:center;justify-content:space-between;gap:12px; }
.matchup-wizard-heading h2#matchup-step-title { display:block !important; font-size:26px; margin:12px 0; }
#matchupForm .matchup-wizard-heading { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px; }
#matchupForm .matchup-wizard-heading .gf-step-guidance { grid-column:1/-1;grid-row:2;margin:0 0 12px; }
.matchup-wizard-actions { margin-top:20px; }
.matchup-wizard-actions button { min-height:44px; }
#matchup-next,#matchup-create { margin-left:auto; }
[data-matchup-step] h3 { display:none; }
.matchup-selection-columns > div { min-width:0; }
#status,#progress-container { max-width:900px; margin:0 auto 10px!important; color:var(--gf-muted,#53665d)!important; }
#matchupForm .matchup-choice-step { display:grid;grid-template-columns:minmax(0,1.2fr) minmax(230px,.8fr);gap:24px;align-items:start; }
.matchup-choice-fields { display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center; }
.matchup-choice-fields label { margin:0;font-weight:600;font-size:14px; }
#matchupForm .matchup-choice-fields select { margin:0!important;padding:8px!important;min-height:40px;box-sizing:border-box;width:100%; }
#matchupForm .matchup-choice-step .matchup-clip-preview { margin:0; }
#matchupForm .matchup-choice-step .matchup-preview-card,#matchupForm .matchup-choice-step .matchup-preview-empty { min-height:144px;box-sizing:border-box; }
#matchupForm .matchup-choice-step .matchup-preview-card img { width:90px;height:120px;max-height:120px; }
#matchupForm .matchup-choice-step .matchup-preview-card { grid-template-columns:90px minmax(0,1fr);padding:10px; }
#matchupForm .matchup-wizard-actions { border-top:1px solid var(--gf-line,#dfe4e7);padding-top:12px;margin-top:18px; }
@media(max-width:650px){ #matchupForm .matchup-choice-step{grid-template-columns:minmax(0,1fr);gap:14px}#matchupForm .matchup-choice-step .matchup-preview-card,#matchupForm .matchup-choice-step .matchup-preview-empty{min-height:90px}#matchupForm .matchup-choice-step .matchup-preview-card img{height:68px}}
@media(max-width:650px) { .matchup-selection-columns { grid-template-columns:minmax(0,1fr); gap:20px; } }
.matchup-clip-preview {
    min-height: 74px;
    margin: 4px 0 12px;
}
.matchup-preview-card {
    display: grid;
    grid-template-columns: 78px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    min-height: 74px;
    padding: 8px;
    border: 1px solid var(--gf-line, #dfe4e7);
    border-radius: 8px;
    background: var(--gf-panel-soft, #fafbfb);
}
.matchup-preview-card img {
    display: block;
    width: 78px;
    height: 56px;
    object-fit: contain;
    border: 1px solid var(--gf-line-strong, #cbd3d8);
    border-radius: 6px;
    background: #101820;
}
.matchup-preview-card strong {
    display: block;
    color: var(--gf-ink, #171b1f);
    font-size: 0.86rem;
    line-height: 1.25;
    overflow-wrap: anywhere;
}
.matchup-preview-card span {
    display: block;
    margin-top: 3px;
    color: var(--gf-muted, #6b747c);
    font-size: 0.76rem;
}
.matchup-preview-empty {
    display: grid;
    place-items: center;
    min-height: 74px;
    border: 1px dashed var(--gf-line-strong, #cbd3d8);
    border-radius: 8px;
    color: var(--gf-muted, #6b747c);
    background: var(--gf-panel, #fff);
    font-size: 0.82rem;
    font-weight: 700;
}
</style>




<!-- FFmpeg override -->
<script>

function showProgress() {
    document.getElementById("progress-container").style.display = "block";
}

function updateProgress(pct, msg = "") {
    document.getElementById("progress-bar").style.width = pct + "%";
    if (msg) document.getElementById("progress-label").innerText = msg;
}

window.FFMPEG_CORE_PATH   = "/static/js/ffmpeg/ffmpeg-core.js";
window.FFMPEG_WASM_PATH   = "/static/js/ffmpeg/ffmpeg-core.wasm";
window.FFMPEG_WORKER_PATH = "/static/js/ffmpeg/ffmpeg-core.worker.js";

window.FFmpeg = window.FFmpeg || {};

window.FFmpeg.getCreateFFmpegCore = () => ({
    mainScriptUrlOrBlob: window.FFMPEG_CORE_PATH,
    locateFile: (p) => {
        if (p.endsWith(".wasm"))      return window.FFMPEG_WASM_PATH;
        if (p.endsWith(".worker.js")) return window.FFMPEG_WORKER_PATH;
        return p;
    }
});
</script>

<script src="/static/js/ffmpeg/ffmpeg.min.js"></script>


<script>
document.addEventListener("DOMContentLoaded", async () => {


    const { createFFmpeg } = FFmpeg;

    let ffmpeg = null;

    function log(msg) {
        document.getElementById("status").innerText = msg;
    }

    async function ensureFfmpeg() {
        if (ffmpeg && ffmpeg.isLoaded()) {
            return ffmpeg;
        }
        log("Loading FFmpeg...");
        ffmpeg = createFFmpeg({
            log: true,
            corePath: window.FFMPEG_CORE_PATH
        });
        await ffmpeg.load();
        log("FFmpeg ready!");
        return ffmpeg;
    }

    log("Loading FFmpeg…");
    log("Ready to create matchup.");


    //------------------------------------------------
    // TEAM / CLIP MAPS
    //------------------------------------------------
    const pitcherMap   = {{ pitcher_map | tojson }};
    const pitchClipMap = {{ pitch_clip_map | tojson }};
    const hitterMap    = {{ hitter_map | tojson }};
    const swingClipMap = {{ swing_clip_map | tojson }};
    const defaultPitch = {
        team: {{ default_pitch_team_id | tojson }},
        player: {{ default_pitcher_id | tojson }},
        clip: {{ default_pitch_clip_id | tojson }}
    };
    const defaultSwing = {
        team: {{ default_swing_team_id | tojson }},
        player: {{ default_hitter_id | tojson }},
        clip: {{ default_swing_clip_id | tojson }}
    };

    const ptTeam = document.getElementById("pitch_team");
    const ptPitcher = document.getElementById("pitch_pitcher");
    const ptClip = document.getElementById("pitch_clip");
    const ptPreview = document.getElementById("pitch_clip_preview");

    const swTeam = document.getElementById("swing_team");
    const swHitter = document.getElementById("swing_hitter");
    const swClip = document.getElementById("swing_clip");
    const swPreview = document.getElementById("swing_clip_preview");
    let matchupStep = 0;
    let matchupBusy = false;
    function showMatchupStep(step) {
        matchupStep = step;
        document.querySelectorAll('[data-matchup-step]').forEach(panel => { panel.hidden = Number(panel.dataset.matchupStep) !== step; });
        document.getElementById('matchup-step-title').textContent = ['Choose a pitch','Choose a swing','Review matchup'][step];
        document.getElementById('matchup-step-count').textContent = `Step ${step + 1} of 3`;
        document.getElementById('matchup-back').hidden = step === 0;
        document.getElementById('matchup-next').hidden = step === 2;
        document.getElementById('matchup-create').hidden = step !== 2;
        document.getElementById('matchup-wizard-error').hidden = true;
        updateSelectedPreviews();
        if (step === 2) {
            const review = document.getElementById('matchup-review-clips');
            review.replaceChildren(ptPreview.cloneNode(true), swPreview.cloneNode(true));
            review.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        }
        document.getElementById('matchup-step-title').focus();
    }
    function advanceMatchup() {
        const valid = matchupStep === 0
            ? selectedClipFromMap(pitchClipMap,ptPitcher.value,ptClip.value)
            : selectedClipFromMap(swingClipMap,swHitter.value,swClip.value);
        if (!valid) {
            const error = document.getElementById('matchup-wizard-error');
            error.textContent = matchupStep === 0 ? 'Choose a saved pitch to continue.' : 'Choose a saved swing to continue.';
            error.hidden = false;
            return;
        }
        if (matchupStep === 1 && valid.pending_id) {
            const query = new URLSearchParams({id: String(valid.pending_id), sid: document.getElementById('sid').value,
                matchup_pitch_id: ptClip.value, matchup_description: document.getElementById('desc').value});
            if (new URLSearchParams(location.search).get('embedded') === '1') query.set('embedded','1');
            location.href = `/multi-swing/pending/tag?${query}`;
            return;
        }
        showMatchupStep(Math.min(2,matchupStep+1));
    }
    document.getElementById('matchup-next').onclick = advanceMatchup;
    document.getElementById('matchup-back').onclick = () => { if (!matchupBusy) showMatchupStep(Math.max(0,matchupStep-1)); };

    function selectedClipFromMap(map, playerId, clipId) {
        const clips = map[String(playerId)] || [];
        return clips.find((clip) => String(clip.id) === String(clipId)) || null;
    }

    function renderClipPreview(target, clip, typeLabel) {
        if (!target) return;
        if (!clip || !clip.id) {
            target.innerHTML = `<div class="matchup-preview-empty">Select a ${typeLabel.toLowerCase()} clip</div>`;
            return;
        }
        const safeLabel = String(clip.label || `${typeLabel} ${clip.id}`).replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;",
        }[ch]));
        target.innerHTML = `
            <div class="matchup-preview-card">
                <img src="${clip.thumbnail}" alt="${typeLabel} thumbnail" loading="lazy"
                     onerror="this.closest('.matchup-preview-card').querySelector('img').style.visibility='hidden';">
                <div>
                    <strong>${safeLabel}</strong>
                    <span>${clip.pending_id ? 'Needs timing' : `${typeLabel} #${clip.id}`}</span>
                </div>
            </div>`;
    }

    function updateSelectedPreviews() {
        renderClipPreview(ptPreview, selectedClipFromMap(pitchClipMap, ptPitcher.value, ptClip.value), "Pitch");
        renderClipPreview(swPreview, selectedClipFromMap(swingClipMap, swHitter.value, swClip.value), "Swing");
        const selectedSwing = selectedClipFromMap(swingClipMap, swHitter.value, swClip.value);
        document.getElementById('matchup-next').textContent = matchupStep === 1 && selectedSwing?.pending_id ? 'Set swing timing' : 'Continue';
    }

    ptTeam.onchange = () => {
        ptPitcher.innerHTML = "";
        ptClip.innerHTML = "";
        updateSelectedPreviews();
    
        const pitchers = [...(pitcherMap[ptTeam.value] || [])].sort((a, b) => {
            const aDate = ((pitchClipMap[a.id] || [])[0] || {}).created_at || "";
            const bDate = ((pitchClipMap[b.id] || [])[0] || {}).created_at || "";
            return bDate.localeCompare(aDate);
        });
        let added = 0;
        // Prefer pitchers that already have clips.
        pitchers.forEach(p => {
            const clips = pitchClipMap[p.id] || [];
            if (clips.length > 0) {
                ptPitcher.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                added += 1;
            }
        });

        // Fallback: if none have clips yet, still show all pitchers for that team.
        if (added === 0) {
            pitchers.forEach(p => {
                ptPitcher.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        }
    
        // Auto-select the first valid pitcher
        if (ptPitcher.options.length > 0) {
            ptPitcher.selectedIndex = 0;
            ptPitcher.onchange();
        }
    };


    ptPitcher.onchange = () => {
        ptClip.innerHTML = "";

        const clips = pitchClipMap[ptPitcher.value] || [];
        if (clips.length === 0) {
            ptClip.innerHTML = `<option value="">No pitch clips for this pitcher</option>`;
            updateSelectedPreviews();
            return;
        }
    
        // Add ALL clips for this pitcher
        clips.forEach(c => {
            ptClip.innerHTML += `<option value="${c.id}">${c.label}</option>`;
        });
    
        // Clips are already provided newest-first.
        ptClip.selectedIndex = 0;
        updateSelectedPreviews();
    };


    swTeam.onchange = () => {
        swHitter.innerHTML = "";
        swClip.innerHTML = "";
        updateSelectedPreviews();
    
        const hitters = [...(hitterMap[swTeam.value] || [])].sort((a, b) => {
            const aDate = ((swingClipMap[a.id] || [])[0] || {}).created_at || "";
            const bDate = ((swingClipMap[b.id] || [])[0] || {}).created_at || "";
            return bDate.localeCompare(aDate);
        });
        let added = 0;
        // Prefer hitters that already have clips.
        hitters.forEach(h => {
            const clips = swingClipMap[h.id] || [];
            if (clips.length > 0) {
                swHitter.innerHTML += `<option value="${h.id}">${h.name}</option>`;
                added += 1;
            }
        });

        // Fallback: if none have clips yet, still show all hitters for that team.
        if (added === 0) {
            hitters.forEach(h => {
                swHitter.innerHTML += `<option value="${h.id}">${h.name}</option>`;
            });
        }
    
        // Auto-select first valid hitter
        if (swHitter.options.length > 0) {
            swHitter.selectedIndex = 0;
            swHitter.onchange();
        }
    };


    swHitter.onchange = () => {
        swClip.innerHTML = "";
    
        const clips = swingClipMap[swHitter.value] || [];
        if (clips.length === 0) {
            swClip.innerHTML = `<option value="">No swing clips for this hitter</option>`;
            updateSelectedPreviews();
            return;
        }
    
        // Add ALL clips for this hitter
        clips.forEach(c => {
            swClip.innerHTML += `<option value="${c.id}">${c.label}</option>`;
        });
    
        // Clips are already provided newest-first.
        swClip.selectedIndex = 0;
        updateSelectedPreviews();
    };

    ptClip.onchange = updateSelectedPreviews;
    swClip.onchange = updateSelectedPreviews;

    // Initialize dropdowns on first load.
    const initPitchTeam = Array.from(ptTeam.options).find((opt) => {
        if (!opt.value) return false;
        const pitchers = pitcherMap[opt.value] || [];
        return pitchers.some((p) => (pitchClipMap[p.id] || []).length > 0);
    });
    const initSwingTeam = Array.from(swTeam.options).find((opt) => {
        if (!opt.value) return false;
        const hitters = hitterMap[opt.value] || [];
        return hitters.some((h) => (swingClipMap[h.id] || []).length > 0);
    });
    if (defaultPitch.team != null && Array.from(ptTeam.options).some((opt) => String(opt.value) === String(defaultPitch.team))) {
        ptTeam.value = String(defaultPitch.team);
        ptTeam.onchange();
        ptPitcher.value = String(defaultPitch.player);
        ptPitcher.onchange();
        ptClip.value = String(defaultPitch.clip);
        updateSelectedPreviews();
    } else if (initPitchTeam) {
        ptTeam.value = initPitchTeam.value;
        ptTeam.onchange();
    } else if (ptTeam.options.length > 1) {
        ptTeam.selectedIndex = 1;
        ptTeam.onchange();
    }
    if (defaultSwing.team != null && Array.from(swTeam.options).some((opt) => String(opt.value) === String(defaultSwing.team))) {
        swTeam.value = String(defaultSwing.team);
        swTeam.onchange();
        swHitter.value = String(defaultSwing.player);
        swHitter.onchange();
        swClip.value = String(defaultSwing.clip);
        updateSelectedPreviews();
    } else if (initSwingTeam) {
        swTeam.value = initSwingTeam.value;
        swTeam.onchange();
    } else if (swTeam.options.length > 1) {
        swTeam.selectedIndex = 1;
        swTeam.onchange();
    }
    updateSelectedPreviews();


    const requested = new URLSearchParams(location.search);
    function restoreClip(id, clipMap, peopleMap, team, player, clip) {
        if (!id) return false;
        for (const [playerId, clips] of Object.entries(clipMap)) {
            if (!clips.some(item => String(item.id) === id)) continue;
            const teamEntry = Object.entries(peopleMap).find(([, people]) => people.some(person => String(person.id) === playerId));
            if (!teamEntry) return false;
            team.value = teamEntry[0]; team.onchange();
            player.value = playerId; player.onchange(); clip.value = id;
            updateSelectedPreviews(); return true;
        }
        return false;
    }
    const restoredPitch = restoreClip(requested.get('pitch_id'), pitchClipMap, pitcherMap, ptTeam, ptPitcher, ptClip);
    const restoredSwing = restoreClip(requested.get('swing_id'), swingClipMap, hitterMap, swTeam, swHitter, swClip);
    document.getElementById('desc').value = requested.get('description') || '';
    if (requested.get('resume') === '1' && restoredPitch && restoredSwing) showMatchupStep(2);

    //------------------------------------------------
    // FRAME EXTRACTION
    //------------------------------------------------
    async function extractFramesFromVideo(arrayBuffer) {
        const blob = new Blob([arrayBuffer], { type: "video/mp4" });
        const url = URL.createObjectURL(blob);
        const video = document.createElement("video");
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";

        const captureCanvas = document.createElement("canvas");
        const captureVideoFrame = async () => {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return null;
            if (captureCanvas.width !== vw || captureCanvas.height !== vh) {
                captureCanvas.width = vw;
                captureCanvas.height = vh;
            }
            const ctx = captureCanvas.getContext("2d");
            ctx.drawImage(video, 0, 0, vw, vh);
            return createImageBitmap(captureCanvas);
        };

        const appendGuaranteedTailFrame = async (frames) => {
            try {
                const dur = Number(video.duration);
                if (!Number.isFinite(dur) || dur <= 0) return frames;
                await new Promise((resolve) => {
                    const onSeeked = () => resolve();
                    video.addEventListener("seeked", onSeeked, { once: true });
                    video.currentTime = Math.max(0, dur - 0.001);
                });
                const tail = await captureVideoFrame();
                if (tail) frames.push(tail);
            } catch (_) {
                // Best effort only; keep decoded frames if seek fails on some browsers.
            }
            return frames;
        };

        // Primary path: MediaStreamTrackProcessor frame-by-frame decode (more complete).
        if (typeof MediaStreamTrackProcessor !== "undefined") {
            await video.play().catch(()=>{});
            const stream = video.captureStream();
            const track = stream.getVideoTracks()[0];
            if (track) {
                const reader = new MediaStreamTrackProcessor(track).readable.getReader();
                const frames = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const bmp = await createImageBitmap(value);
                    value.close();
                    frames.push(bmp);
                }
                await appendGuaranteedTailFrame(frames);
                video.pause();
                video.src = "";
                video.load();
                URL.revokeObjectURL(url);
                return frames;
            }
        }

        // Fallback: requestVideoFrameCallback
        return new Promise(async (resolve) => {
            await video.play().catch(()=>{});
            const frames = [];
            async function captureFrame() {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                if (vw && vh) {
                    const bmp = await captureVideoFrame();
                    if (bmp) frames.push(bmp);
                }
                video.requestVideoFrameCallback(captureFrame);
            }
            video.requestVideoFrameCallback(captureFrame);
            video.onended = () => {
                appendGuaranteedTailFrame(frames).finally(() => {
                    video.pause();
                    video.src = "";
                    video.load();
                    URL.revokeObjectURL(url);
                    resolve(frames);
                });
            };
        });
    }

    function releaseFrameSequence(frames) {
        if (!frames || !frames.length) return;
        for (const frame of frames) {
            try {
                if (frame && typeof frame.close === "function") frame.close();
            } catch (_) {}
        }
        frames.length = 0;
    }



    //------------------------------------------------
    // FORM SUBMIT
    //------------------------------------------------
    /* Legacy high-memory matchup builder disabled.
    document.getElementById("matchupForm").onsubmit = async e => {
        e.preventDefault();

        showProgress();
        updateProgress(2, "Downloading clips…");
        log("Downloading clips…");

        const pitch_id = ptClip.value;
        const swing_id = swClip.value;
        const desc = (document.getElementById("desc").value || "Matchup").replace(/"/g,"'");

        const pitchBuf = await fetch(`/stream/pitch_clip?id=${pitch_id}`).then(r=>r.arrayBuffer());
        const swingBuf = await fetch(`/stream/swing_clip?id=${swing_id}`).then(r=>r.arrayBuffer());

        updateProgress(10, "Extracting frames…");

        const pitchF = await extractFramesFromVideo(pitchBuf);
        const swingF = await extractFramesFromVideo(swingBuf);

        const meta = await fetch(`/api/swing_meta?id=${swing_id}`).then(r => r.json());
        let decision_frame = Number(meta.decision_frame);

        const yellow = [255,255,0,0.25];

    document.getElementById("matchupForm").onsubmit = async e => {
        e.preventDefault();

        showProgress();
        updateProgress(2, "Downloading clips...");
        log("Downloading clips...");

        const pitch_id = ptClip.value;
        const swing_id = swClip.value;
        const desc = (document.getElementById("desc").value || "Matchup").replace(/"/g, "'");
        const [pitchBuf, swingBuf, pitchMeta, swingMeta] = await Promise.all([
            fetch(`/stream/pitch_clip?id=${pitch_id}`).then(r => r.arrayBuffer()),
            fetch(`/stream/swing_clip?id=${swing_id}`).then(r => r.arrayBuffer()),
            fetch(`/api/pitch_meta?id=${pitch_id}`).then(r => r.json()),
            fetch(`/api/swing_meta?id=${swing_id}`).then(r => r.json()),
        ]);

        const pitchFrameCount = Number(pitchMeta.frame_count || 0);
        const swingFrameCount = Number(swingMeta.frame_count || 0);
        const decisionFrame = Number(swingMeta.decision_frame);
        const commonFps = 30;

        if (!pitchFrameCount || !swingFrameCount) {
            alert("Unable to read clip timing for matchup.");
            return;
        }

        const padCount = Math.max(0, pitchFrameCount - swingFrameCount);
        const swingLastIdx = Math.max(0, swingFrameCount - 1);
        const decisionLocal = Number.isFinite(decisionFrame)
            ? Math.max(0, Math.min(swingLastIdx, Math.round(decisionFrame)))
            : Math.max(0, swingLastIdx - 5);
        let decisionGlobal = decisionLocal + padCount;
        const contactGlobal = pitchFrameCount - 1;
        if (decisionGlobal >= contactGlobal) {
            decisionGlobal = Math.max(padCount, contactGlobal - 1);
        }

        const FREEZE_FRAMES = 60;
        const END_DECISION_FREEZE_FRAMES = 90;
        const TITLE_FRAMES = 120;

        updateProgress(12, "Loading source videos into FFmpeg...");

        const runDir = `run_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
        ffmpeg.FS("mkdir", runDir);
        const pitchPath = `${runDir}/pitch.mp4`;
        const swingPath = `${runDir}/swing.mp4`;
        const titlePath = `${runDir}/title.mp4`;
        const segmentPaths = [];

        ffmpeg.FS("writeFile", pitchPath, new Uint8Array(pitchBuf));
        ffmpeg.FS("writeFile", swingPath, new Uint8Array(swingBuf));

        const OUTPUT_W = 1280;
        const OUTPUT_H = 720;
        const HALF_W = 640;
        const matchupDate = new Date().toLocaleDateString();
        const swingDuration = Number.isFinite(Number(swingMeta.swing_seconds))
            ? Number(swingMeta.swing_seconds).toFixed(2)
            : (swingFrameCount / commonFps).toFixed(2);
        const decisionToContact = Number.isFinite(Number(swingMeta.decision_frame))
            ? Math.max(0, ((swingFrameCount - 1) - Number(swingMeta.decision_frame)) / commonFps).toFixed(2)
            : "--";
        const hitterName = swHitter.options[swHitter.selectedIndex].text;
        const pitcherName = ptPitcher.options[ptPitcher.selectedIndex].text;

        function framesToCloneSeconds(frameCount) {
            return Math.max(0, (frameCount - 1) / commonFps);
        }

        function buildLabelPng(text, bg = "rgba(0,0,0,0.72)") {
            const c = document.createElement("canvas");
            c.width = 420;
            c.height = 72;
            const ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 34px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(String(text), c.width / 2, c.height / 2);
            return new Promise((resolve, reject) => {
                c.toBlob(async (blob) => {
                    if (!blob) {
                        reject(new Error("label png failed"));
                        return;
                    }
                    resolve(new Uint8Array(await blob.arrayBuffer()));
                }, "image/png");
            });
        }

        async function writeLabel(name, text) {
            const path = `${runDir}/${name}.png`;
            ffmpeg.FS("writeFile", path, await buildLabelPng(text));
            return path;
        }

        const firstMoveLabel = await writeLabel("label_first_move", "First Move");
        const decisionLabel = await writeLabel("label_decision", "Decision");
        const contactLabel = await writeLabel("label_contact", "Contact");

        function sideChain(inputIndex, startFrame, endFrame, freezeFrames = 0, tint = null) {
            const endFrameExclusive = Math.max(startFrame + 1, endFrame);
            let chain = `[${inputIndex}:v]trim=start_frame=${startFrame}:end_frame=${endFrameExclusive},setpts=PTS-STARTPTS`;
            if (freezeFrames > 0) {
                chain += `,tpad=stop_mode=clone:stop_duration=${framesToCloneSeconds(freezeFrames)}`;
            }
            if (tint) {
                chain += `,drawbox=x=0:y=0:w=iw:h=ih:color=${tint}@0.25:t=fill`;
            }
            chain += `,scale=${HALF_W}:${OUTPUT_H}:force_original_aspect_ratio=decrease,pad=${HALF_W}:${OUTPUT_H}:(ow-iw)/2:(oh-ih)/2:black`;
            return chain;
        }

        async function buildStackSegment(name, pitchSpec, swingSpec, labelPath = null) {
            const outputPath = `${runDir}/${name}.mp4`;
            const args = [
                "-y",
                "-i", pitchPath,
                "-i", swingPath,
            ];
            if (labelPath) {
                args.push("-loop", "1", "-i", labelPath);
            }
            const filters = [
                `${sideChain(0, pitchSpec.start, pitchSpec.end, pitchSpec.freezeFrames || 0, pitchSpec.tint || null)}[left]`,
                `${sideChain(1, swingSpec.start, swingSpec.end, swingSpec.freezeFrames || 0, swingSpec.tint || null)}[right]`,
                `[left][right]hstack=inputs=2[stacked]`,
            ];
            let finalMap = "[stacked]";
            if (labelPath) {
                filters.push(`[stacked][2:v]overlay=(W-w)/2:H-h-22:shortest=1[labeled]`);
                finalMap = "[labeled]";
            }
            args.push(
                "-filter_complex", filters.join(";"),
                "-map", finalMap,
                "-r", String(commonFps),
                "-c:v", "libx264",
                "-preset", "veryfast",
                "-crf", "23",
                "-pix_fmt", "yuv420p",
                "-movflags", "+faststart",
                outputPath
            );
            await ffmpeg.run(...args);
            segmentPaths.push(outputPath);
        }

        async function buildTitleSegment() {
            const c = document.createElement("canvas");
            c.width = OUTPUT_W;
            c.height = OUTPUT_H;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, OUTPUT_W, OUTPUT_H);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "48px Arial";
            ctx.fillText(desc || "Matchup", OUTPUT_W / 2, 180);
            ctx.font = "42px Arial";
            ctx.fillText(`${hitterName} vs ${pitcherName}`, OUTPUT_W / 2, 260);
            ctx.font = "36px Arial";
            ctx.fillText(`Swing Time: ${swingDuration}s`, OUTPUT_W / 2, 340);
            ctx.font = "32px Arial";
            ctx.fillText(`Decision to Contact: ${decisionToContact}${decisionToContact === "--" ? "" : "s"}`, OUTPUT_W / 2, 400);
            ctx.fillText(matchupDate, OUTPUT_W / 2, 460);
            const blob = await new Promise((resolve) => c.toBlob(resolve, "image/png"));
            const titlePng = `${runDir}/title.png`;
            ffmpeg.FS("writeFile", titlePng, new Uint8Array(await blob.arrayBuffer()));
            await ffmpeg.run(
                "-y",
                "-loop", "1",
                "-i", titlePng,
                "-t", String(TITLE_FRAMES / commonFps),
                "-r", String(commonFps),
                "-c:v", "libx264",
                "-preset", "veryfast",
                "-crf", "23",
                "-pix_fmt", "yuv420p",
                "-movflags", "+faststart",
                titlePath
            );
            segmentPaths.push(titlePath);
            try { ffmpeg.FS("unlink", titlePng); } catch (_) {}
        }

        updateProgress(22, "Building title segment...");
        await buildTitleSegment();

        if (padCount > 0) {
            updateProgress(30, "Building lead-in segment...");
            await buildStackSegment(
                "seg_01_leadin",
                { start: 0, end: padCount },

            );
        }

        updateProgress(38, "Building first move segment...");
        await buildStackSegment(
            "seg_02_first_move",
            { start: padCount, end: padCount + 1, freezeFrames: FREEZE_FRAMES, tint: "yellow" },
            { start: 0, end: 1, freezeFrames: FREEZE_FRAMES, tint: "yellow" },
            firstMoveLabel
        );

        if (decisionGlobal > padCount + 1) {
            updateProgress(46, "Building start-to-decision segment...");
            await buildStackSegment(
                "seg_03_motion_start_decision",
                { start: padCount + 1, end: decisionGlobal },
                { start: 1, end: decisionLocal }
            );
        }

        updateProgress(54, "Building decision segment...");
        await buildStackSegment(
            "seg_04_decision",
            { start: decisionGlobal, end: decisionGlobal + 1, freezeFrames: FREEZE_FRAMES, tint: "green" },
            { start: decisionLocal, end: decisionLocal + 1, freezeFrames: FREEZE_FRAMES, tint: "green" },
            decisionLabel
        );

        if (contactGlobal > decisionGlobal + 1) {
            updateProgress(62, "Building decision-to-contact segment...");
            await buildStackSegment(
                "seg_05_motion_decision_contact",
                { start: decisionGlobal + 1, end: contactGlobal + 1 },

        updateProgress(70, "Building contact segment...");
        await buildStackSegment(

        await buildStackSegment(

            decisionLabel

        const concatList = `${runDir}/concat.txt`;

        for (const p of segmentPaths) {
            try { ffmpeg.FS("unlink", p); } catch (_) {}
        }
        for (const p of [firstMoveLabel, decisionLabel, contactLabel, pitchPath, swingPath]) {
            try { ffmpeg.FS("unlink", p); } catch (_) {}

        try { ffmpeg.FS("rmdir", runDir); } catch (_) {}

        updateProgress(100, "Done!");
