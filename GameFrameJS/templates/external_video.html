{% extends "base.html" %}
{% block content %}

<h2>Import Video From Link</h2>

{% if error %}
<div style="background:#3a1010; border:1px solid #7d2a2a; color:#ffd2d2; padding:10px; border-radius:8px; margin-bottom:14px;">
  {{ error }}
</div>
{% endif %}

<form method="post" action="/external_video/fetch" style="max-width: 900px;">
  <input type="hidden" name="sid" value="{{ sid }}">

  <div style="display:grid; grid-template-columns: 180px 1fr; gap:10px; align-items:center; margin-bottom:12px;">
    <label for="video_url">Video Link:</label>
    <input id="video_url" name="video_url" required
           placeholder="https://youtube.com/... or x.com/... or instagram.com/... or tiktok.com/..."
           value="{{ video_url or '' }}">
  </div>

  <div style="display:grid; grid-template-columns: 180px 1fr; gap:10px; align-items:center; margin-bottom:12px;">
    <label for="clip_type">Clip Type:</label>
    <select id="clip_type" name="clip_type" required>
      <option value="pitch" {% if clip_type == "pitch" %}selected{% endif %}>Pitch</option>
      <option value="swing" {% if clip_type != "pitch" %}selected{% endif %}>Swing</option>
    </select>
  </div>

  <button type="submit">Fetch Video</button>
</form>

<p style="margin-top:14px; color:#9e9e9e; max-width:900px;">
  After fetch completes, you will get a timeline selector to pick an exact 5-second window.
  That clip will then open in the matching upload flow.
</p>

{% endblock %}
