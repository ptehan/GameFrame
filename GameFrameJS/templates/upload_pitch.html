{% extends "base.html" %}
{% block content %}

<style>
.pitch-upload-form {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 14px 12px;
    width: min(560px, 100%);
    align-items: start;
}
.pitch-upload-field {
    display: grid;
    gap: 8px;
}
.pitch-upload-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}
.pitch-upload-control {
    min-height: 42px;
    box-sizing: border-box;
}
.pitch-upload-row .pitch-upload-control {
    flex: 1 1 auto;
}
.pitch-upload-action {
    min-height: 42px;
    min-width: 92px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
}
.pitch-upload-time {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}
.pitch-upload-time .pitch-upload-control {
    width: 78px;
    flex: 0 0 78px;
}
.pitch-upload-submit {
    min-height: 42px;
    width: 150px;
    box-sizing: border-box;
}
</style>

<h2 style="margin-bottom: 20px;">Upload Pitch Clip</h2>

<form action="/upload/pitch"
      method="post"
      enctype="multipart/form-data"
      class="pitch-upload-form">

    <input type="hidden" name="sid" value="{{ sid }}">

    <!-- TEAM -->
    <label>Team:</label>
    <div class="pitch-upload-row">
        <select id="team_select" name="team_id" required class="pitch-upload-control">
            <option value="">Select Team</option>
            {% for t in teams %}
                <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
        </select>
        <button type="button" id="add_team_btn" class="pitch-upload-action">Add Team</button>
    </div>

    <!-- PITCHER -->
    <label>Pitcher:</label>
    <div class="pitch-upload-row">
        <select id="pitcher_select" name="pitcher_id" required class="pitch-upload-control">
            <option value="">Select Pitcher</option>
            {% for p in pitchers %}
                <option value="{{ p.id }}" data-team="{{ p.team_id }}">{{ p.name }}</option>
            {% endfor %}
        </select>
        <button type="button" id="add_pitcher_btn" class="pitch-upload-action">Add Pitcher</button>
    </div>

    <!-- DESCRIPTION -->
    <label>Description:</label>
    <input type="text" name="description" placeholder="Optional note..." class="pitch-upload-control">

    <!-- START TIME -->
    <label>Start Time:</label>
    <div class="pitch-upload-field">
    <div class="pitch-upload-time">
        <input type="number" name="start_min" min="0" value="0" class="pitch-upload-control">
        <span style="align-self:center;">min</span>
    
        <input type="number" name="start_sec" min="0" max="59" value="0" class="pitch-upload-control">
        <span style="align-self:center;">sec</span>
    </div>
    <small style="color: #ccc; font-size: 12px;">Note: This will extract a 5-second clip starting from the specified time.</small>
    </div>

    <!-- FILE -->
    <label>Video File:</label>
    <input type="file" id="file_input" name="file" accept="video/mp4" required class="pitch-upload-control">

    <!-- BUTTON -->
    <div></div>
    <button type="submit" class="pitch-upload-submit">Upload Pitch</button>

</form>

<div id="entity_modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999;">
    <div style="max-width:420px; margin:10vh auto; background:#181818; border:1px solid #444; border-radius:10px; padding:14px;">
        <div id="entity_modal_title" style="font-weight:700; margin-bottom:10px;">Add</div>
        <input id="entity_name_input" type="text" placeholder="Name" style="width:100%; padding:8px; margin-bottom:10px;">
        <div id="entity_modal_error" style="color:#ff8a8a; min-height:18px; font-size:12px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button type="button" id="entity_cancel_btn">Cancel</button>
            <button type="button" id="entity_save_btn">Save</button>
        </div>
    </div>
</div>

<script>
// Simple team -> pitcher filter
const teamSel = document.getElementById("team_select");
const pitcherSel = document.getElementById("pitcher_select");

// Store all pitcher options
let allPitchers = Array.from(pitcherSel.options);
const addTeamBtn = document.getElementById("add_team_btn");
const addPitcherBtn = document.getElementById("add_pitcher_btn");
const entityModal = document.getElementById("entity_modal");
const entityTitle = document.getElementById("entity_modal_title");
const entityInput = document.getElementById("entity_name_input");
const entityError = document.getElementById("entity_modal_error");
const entityCancel = document.getElementById("entity_cancel_btn");
const entitySave = document.getElementById("entity_save_btn");
let entityMode = null;

function refreshPitchersForTeam() {
    const tid = teamSel.value;
    pitcherSel.innerHTML = '<option value="">Select Pitcher</option>';

    allPitchers.forEach(opt => {
        if (opt.dataset.team === tid) {
            pitcherSel.appendChild(opt.cloneNode(true));
        }
    });
}

teamSel.onchange = refreshPitchersForTeam;

function openEntityModal(mode) {
    entityMode = mode;
    entityTitle.textContent = mode === "team" ? "Add Team" : "Add Pitcher";
    entityInput.value = "";
    entityError.textContent = "";
    entityModal.style.display = "block";
    setTimeout(() => entityInput.focus(), 0);
}

function closeEntityModal() {
    entityModal.style.display = "none";
    entityMode = null;
}

async function submitEntityModal() {
    const name = (entityInput.value || "").trim();
    if (!name) {
        entityError.textContent = "Name is required.";
        return;
    }
    entityError.textContent = "";

    try {
        if (entityMode === "team") {
            const fd = new FormData();
            fd.append("name", name);
            const r = await fetch("/upload/common/add-team", { method: "POST", body: fd });
            const data = await r.json();
            if (!r.ok || !data.ok) throw new Error(data.error || "Failed to add team.");
            const opt = document.createElement("option");
            opt.value = String(data.id);
            opt.textContent = data.name;
            teamSel.appendChild(opt);
            teamSel.value = String(data.id);
            refreshPitchersForTeam();
            closeEntityModal();
            return;
        }

        if (entityMode === "pitcher") {
            const tid = teamSel.value;
            if (!tid) {
                entityError.textContent = "Select a team first.";
                return;
            }
            const fd = new FormData();
            fd.append("team_id", tid);
            fd.append("name", name);
            const r = await fetch("/upload/common/add-pitcher", { method: "POST", body: fd });
            const data = await r.json();
            if (!r.ok || !data.ok) throw new Error(data.error || "Failed to add pitcher.");
            const opt = document.createElement("option");
            opt.value = String(data.id);
            opt.dataset.team = String(data.team_id);
            opt.textContent = data.name;
            allPitchers.push(opt);
            refreshPitchersForTeam();
            pitcherSel.value = String(data.id);
            closeEntityModal();
        }
    } catch (e) {
        entityError.textContent = e.message || "Save failed.";
    }
}

addTeamBtn.onclick = () => openEntityModal("team");
addPitcherBtn.onclick = () => openEntityModal("pitcher");
entityCancel.onclick = closeEntityModal;
entitySave.onclick = submitEntityModal;
entityModal.addEventListener("click", (ev) => {
    if (ev.target === entityModal) closeEntityModal();
});
entityInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") submitEntityModal();
});
</script>

<!-- ============================================================= -->
<!-- NEW: Auto-load YouTube temp file into <input type="file"> -->
<!-- ============================================================= -->
{% if request.query_params.from_yt %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const tempId = "{{ request.query_params.temp_id }}";
    if (!tempId) return;

    // Request the temp file from FastAPI
    fetch(`/import/youtube/tempfile?temp_id=${tempId}`)
        .then(r => r.blob())
        .then(blob => {
            const file = new File([blob], "youtube_clip.mp4", { type: "video/mp4" });

            const dt = new DataTransfer();
            dt.items.add(file);

            document.getElementById("file_input").files = dt.files;
        })
        .catch(err => console.error("YT temp load error:", err));
});
</script>
{% endif %}

{% endblock %}
