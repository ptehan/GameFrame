{% extends "base.html" %}
{% block content %}

<style>
@keyframes pitch-processing { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
#video_upload_bar.is-processing { width: 30% !important; animation: pitch-processing 1.4s linear infinite; }
.pitch-upload-form {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 14px 12px;
    width: min(560px, 100%);
    align-items: start;
}
.pitch-upload-field {
    display: grid;
    gap: 8px;
}
.pitch-upload-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 112px;
    gap: 8px;
    align-items: stretch;
    min-width: 0;
}
.pitch-upload-control {
    min-height: 42px;
    box-sizing: border-box;
}
.pitch-upload-row .pitch-upload-control {
    width: 100%;
    min-width: 0;
    height: 42px;
}
.pitch-upload-action {
    min-height: 42px;
    width: 112px;
    height: 42px;
    padding: 0 10px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
}
.pitch-upload-time {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}
.pitch-upload-time .pitch-upload-control {
    width: 78px;
    flex: 0 0 78px;
}
.pitch-upload-submit {
    min-height: 42px;
    width: 150px;
    box-sizing: border-box;
}
.pitch-upload-form [hidden] { display:none!important; }
@media (max-width: 600px) {
    .pitch-upload-form { grid-template-columns: minmax(0, 1fr); }
    .pitch-upload-form > div:empty { display: none; }
}
.pitch-file-control{display:grid;gap:6px;color:var(--gf-muted);font-size:.82rem;font-weight:700}
.pitch-file-row{display:flex;align-items:center;gap:8px;min-height:36px;border:1px solid var(--gf-line-strong);border-radius:6px;background:#fff;padding:4px}
.pitch-file-row input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
.pitch-file-button{display:inline-flex;align-items:center;justify-content:center;min-height:28px;border:1px solid var(--gf-line-strong);border-radius:6px;background:#fff;color:var(--gf-ink);padding:0 10px;font-size:.88rem;font-weight:700;cursor:pointer}
.pitch-file-button:hover{border-color:#95a3aa;background:var(--gf-panel-soft)}
.pitch-file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gf-muted);font-weight:600}
.pitch-entity-modal{display:none;position:fixed;inset:0;background:rgb(10 17 22 / .56);z-index:9999;align-items:center;justify-content:center;padding:16px}
.pitch-entity-card{width:min(420px,calc(100vw - 32px));display:grid;gap:12px;background:var(--gf-panel);border:1px solid var(--gf-line);border-radius:10px;padding:14px;box-shadow:0 24px 70px rgb(20 28 34 / .22)}
.pitch-entity-title{font-weight:800}
.pitch-entity-error{color:var(--gf-danger);min-height:18px;font-size:.82rem;font-weight:700}
.pitch-entity-actions{display:flex;gap:8px;justify-content:flex-end}
</style>

<h2 id="pitch_upload_title" style="padding:14px 18px;background:#edf5f2;border-bottom:2px solid #21776b;">Pick the Pitch Video</h2>
<form action="/upload/pitch"
      method="post"
      enctype="multipart/form-data"
      id="video_upload_form"
      class="pitch-upload-form">

    <input type="hidden" name="sid" value="{{ sid }}">
    <input type="hidden" id="video_created_at" name="video_created_at" value="">

    <!-- TEAM -->
    <label data-upload-step="people">Team:</label>
    <div data-upload-step="people" class="pitch-upload-row">
        <select id="team_select" name="team_id" required class="pitch-upload-control">
            <option value="">Select Team</option>
            {% for t in teams %}
                <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
        </select>
        <button type="button" id="add_team_btn" class="pitch-upload-action">Add Team</button>
    </div>

    <!-- PITCHER -->
    <label data-upload-step="people">Pitcher:</label>
    <div data-upload-step="people" class="pitch-upload-row">
        <select id="pitcher_select" name="pitcher_id" required class="pitch-upload-control">
            <option value="">Select Pitcher</option>
            {% for p in pitchers %}
                <option value="{{ p.id }}" data-team="{{ p.team_id }}">{{ p.name }}</option>
            {% endfor %}
        </select>
        <button type="button" id="add_pitcher_btn" class="pitch-upload-action">Add Pitcher</button>
    </div>

    <!-- DESCRIPTION -->
    <input type="hidden" name="description" value="">

    <!-- START TIME -->
    <label data-upload-step="time">Clip start:</label>
    <div data-upload-step="time" class="pitch-upload-field">
    <div class="pitch-upload-time">
        <input type="number" name="start_min" min="0" value="0" class="pitch-upload-control">
        <span style="align-self:center;">min</span>
    
        <input type="number" name="start_sec" min="0" max="59" value="0" class="pitch-upload-control">
        <span style="align-self:center;">sec</span>
    </div>
    <small style="color: #ccc; font-size: 12px;">Note: This will extract up to a 5-second clip starting from the specified time.</small>
    <div id="start_time_error" role="alert" style="display:none; color:#ff8a8a; font-weight:700;"></div>
    </div>

    <!-- FILE -->
    <label data-upload-step="video">Pitch video</label>
    <div data-upload-step="video" class="pitch-file-control">
        <div class="pitch-file-row">
            <label class="pitch-file-button" for="file_input" role="button" tabindex="0">Choose File</label>
            <span id="pitch_file_name" class="pitch-file-name">No file selected</span>
            <input type="file" id="file_input" name="file" accept="video/mp4" required tabindex="-1" aria-hidden="true">
        </div>
    </div>

    <!-- BUTTON -->
    <div></div>
    <div style="grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end;">
      <button type="button" id="pitch_upload_back">Back</button>
      <button type="button" id="pitch_upload_next">Continue</button>
      <button type="submit" id="video_upload_submit" class="pitch-upload-submit">Continue to Crop</button>
    </div>

    <div></div>
    <div id="video_upload_progress" style="display:none; width:100%; max-width:420px;">
        <div style="height:12px; overflow:hidden; border-radius:6px; background:#333;">
            <div id="video_upload_bar" style="width:0%; height:100%; background:#ffdd00; transition:width .15s;"></div>
        </div>
        <div id="video_upload_status" style="margin-top:7px; font-size:13px;">Loading to GameFrame...</div>
    </div>

</form>

<div id="entity_modal" class="pitch-entity-modal">
    <div class="pitch-entity-card">
        <div id="entity_modal_title" class="pitch-entity-title">Add</div>
        <input id="entity_name_input" type="text" placeholder="Name">
        <div id="entity_modal_error" class="pitch-entity-error"></div>
        <div class="pitch-entity-actions">
            <button type="button" id="entity_cancel_btn">Cancel</button>
            <button type="button" id="entity_save_btn">Save</button>
        </div>
    </div>
</div>

<script>
// Simple team -> pitcher filter
const teamSel = document.getElementById("team_select");
const pitcherSel = document.getElementById("pitcher_select");
let pitchUploadStep = 0;
const pitchUploadSteps = ['video','people','time'];
function showPitchUploadStep() {
    document.querySelectorAll('[data-upload-step]').forEach(el => {
        el.style.display = el.dataset.uploadStep === pitchUploadSteps[pitchUploadStep] ? '' : 'none';
    });
    document.getElementById('pitch_upload_title').textContent = ['Pick the Pitch Video','Select Team and Pitcher','Set the Clip Start'][pitchUploadStep];
    document.getElementById('pitch_upload_back').hidden = pitchUploadStep === 0;
    document.getElementById('pitch_upload_next').hidden = pitchUploadStep === 2;
    document.getElementById('video_upload_submit').hidden = pitchUploadStep !== 2;
}
document.getElementById('pitch_upload_next').onclick = () => {
    if (pitchUploadStep === 0 && !document.getElementById('file_input').files.length) {
        document.getElementById('file_input').click(); return;
    }
    if (pitchUploadStep === 1 && (!teamSel.reportValidity() || !pitcherSel.reportValidity())) return;
    pitchUploadStep = Math.min(2,pitchUploadStep+1); showPitchUploadStep();
};
document.getElementById('pitch_upload_back').onclick = () => { pitchUploadStep = Math.max(0,pitchUploadStep-1); showPitchUploadStep(); };
showPitchUploadStep();

// Store all pitcher options
let allPitchers = Array.from(pitcherSel.options);
const addTeamBtn = document.getElementById("add_team_btn");
const addPitcherBtn = document.getElementById("add_pitcher_btn");
const entityModal = document.getElementById("entity_modal");
const entityTitle = document.getElementById("entity_modal_title");
const entityInput = document.getElementById("entity_name_input");
const entityError = document.getElementById("entity_modal_error");
const entityCancel = document.getElementById("entity_cancel_btn");
const entitySave = document.getElementById("entity_save_btn");
let entityMode = null;

function refreshPitchersForTeam() {
    const tid = teamSel.value;
    pitcherSel.innerHTML = '<option value="">Select Pitcher</option>';

    allPitchers.forEach(opt => {
        if (opt.dataset.team === tid) {
            pitcherSel.appendChild(opt.cloneNode(true));
        }
    });
}

teamSel.onchange = refreshPitchersForTeam;

function openEntityModal(mode) {
    entityMode = mode;
    entityTitle.textContent = mode === "team" ? "Add Team" : "Add Pitcher";
    entityInput.value = "";
    entityError.textContent = "";
    entityModal.style.display = "flex";
    setTimeout(() => entityInput.focus(), 0);
}

function closeEntityModal() {
    entityModal.style.display = "none";
    entityMode = null;
}

async function submitEntityModal() {
    const name = (entityInput.value || "").trim();
    if (!name) {
        entityError.textContent = "Name is required.";
        return;
    }
    entityError.textContent = "";

    try {
        if (entityMode === "team") {
            const fd = new FormData();
            fd.append("name", name);
            const r = await fetch("/upload/common/add-team", { method: "POST", body: fd });
            const data = await r.json();
            if (!r.ok || !data.ok) throw new Error(data.error || "Failed to add team.");
            const opt = document.createElement("option");
            opt.value = String(data.id);
            opt.textContent = data.name;
            teamSel.appendChild(opt);
            teamSel.value = String(data.id);
            refreshPitchersForTeam();
            closeEntityModal();
            return;
        }

        if (entityMode === "pitcher") {
            const tid = teamSel.value;
            if (!tid) {
                entityError.textContent = "Select a team first.";
                return;
            }
            const fd = new FormData();
            fd.append("team_id", tid);
            fd.append("name", name);
            const r = await fetch("/upload/common/add-pitcher", { method: "POST", body: fd });
            const data = await r.json();
            if (!r.ok || !data.ok) throw new Error(data.error || "Failed to add pitcher.");
            const opt = document.createElement("option");
            opt.value = String(data.id);
            opt.dataset.team = String(data.team_id);
            opt.textContent = data.name;
            allPitchers.push(opt);
            refreshPitchersForTeam();
            pitcherSel.value = String(data.id);
            closeEntityModal();
        }
    } catch (e) {
        entityError.textContent = e.message || "Save failed.";
    }
}

addTeamBtn.onclick = () => openEntityModal("team");
addPitcherBtn.onclick = () => openEntityModal("pitcher");
entityCancel.onclick = closeEntityModal;
entitySave.onclick = submitEntityModal;
entityModal.addEventListener("click", (ev) => {
    // Backdrop clicks preserve this form.
});
entityInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") submitEntityModal();
});

const videoUploadForm = document.getElementById("video_upload_form");
const videoUploadSubmit = document.getElementById("video_upload_submit");
const videoUploadProgress = document.getElementById("video_upload_progress");
const videoUploadBar = document.getElementById("video_upload_bar");
const videoUploadStatus = document.getElementById("video_upload_status");
const startTimeError = document.getElementById("start_time_error");
const fileInput = document.getElementById("file_input");
const pitchFileName = document.getElementById("pitch_file_name");
document.querySelector(".pitch-file-button").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        fileInput.click();
    }
});
fileInput.addEventListener("click", () => {
    fileInput.value = "";
    pitchFileName.textContent = "No file selected";
    videoUploadProgress.style.display = "none";
    videoUploadBar.classList.remove("is-processing");
    videoUploadBar.style.width = "0%";
    videoUploadStatus.textContent = "Loading to GameFrame...";
});
fileInput.addEventListener("change", () => {
    pitchFileName.textContent = fileInput.files[0]?.name || "No file selected";
});

async function selectedVideoDuration(file) {
    return new Promise((resolve) => {
        if (!file) return resolve(0);
        const probe = document.createElement("video");
        const url = URL.createObjectURL(file);
        probe.preload = "metadata";
        probe.onloadedmetadata = () => { const value = Number(probe.duration || 0); URL.revokeObjectURL(url); resolve(value); };
        probe.onerror = () => { URL.revokeObjectURL(url); resolve(0); };
        probe.src = url;
    });
}

videoUploadForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (pitchUploadStep !== 2) { document.getElementById('pitch_upload_next').click(); return; }
    if (!videoUploadForm.reportValidity()) return;
    startTimeError.style.display = "none";
    startTimeError.textContent = "";
    const duration = await selectedVideoDuration(fileInput.files[0]);
    const start = Number(videoUploadForm.elements.start_min.value || 0) * 60 + Number(videoUploadForm.elements.start_sec.value || 0);
    if (duration > 0 && start >= duration + 0.05) {
        startTimeError.textContent = `That start time is too late. Choose a time before the video ends (${duration.toFixed(1)} seconds).`;
        startTimeError.style.display = "block";
        return;
    }
    videoUploadSubmit.disabled = true;
    videoUploadProgress.style.display = "block";
    videoUploadBar.classList.remove("is-processing");
    videoUploadBar.parentElement.style.overflow = "hidden";
    videoUploadBar.style.width = "0%";
    videoUploadStatus.textContent = "Loading to GameFrame...";
    const selectedFile = fileInput.files[0];
    document.getElementById("video_created_at").value = selectedFile && selectedFile.name !== "youtube_clip.mp4"
        ? new Date(selectedFile.lastModified).toISOString()
        : "";
    const xhr = new XMLHttpRequest();
    xhr.open("POST", videoUploadForm.action);
    xhr.upload.onprogress = (event) => {
        if (!event.lengthComputable) return;
        const percent = Math.min(99, Math.round((event.loaded / event.total) * 100));
        videoUploadBar.style.width = `${percent}%`;
        videoUploadStatus.textContent = `Uploading video... ${percent}%`;
    };
    xhr.upload.onload = () => {
        videoUploadBar.classList.add("is-processing");
        videoUploadStatus.textContent = "Upload received. Processing pitch video...";
    };
    xhr.onload = () => {
        videoUploadBar.classList.remove("is-processing");
        if (xhr.status >= 200 && xhr.status < 400) {
            videoUploadBar.style.width = "100%";
            videoUploadStatus.textContent = "Clip ready.";
            window.location.href = xhr.responseURL;
            return;
        }
        videoUploadSubmit.disabled = false;
        videoUploadBar.style.width = "0%";
        const message = (xhr.responseText || "").trim();
        videoUploadStatus.textContent = message || "Upload failed. Please try again.";
        if (xhr.status === 400 && message) {
            startTimeError.textContent = message;
            startTimeError.style.display = "block";
        }
    };
    xhr.onerror = () => {
        videoUploadBar.classList.remove("is-processing");
        videoUploadBar.style.width = "0%";
        videoUploadSubmit.disabled = false;
        videoUploadStatus.textContent = "Could not load the video. Please try again.";
    };
    xhr.send(new FormData(videoUploadForm));
});
</script>

<!-- ============================================================= -->
<!-- NEW: Auto-load YouTube temp file into <input type="file"> -->
<!-- ============================================================= -->
{% if request.query_params.from_yt %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const tempId = "{{ request.query_params.temp_id }}";
    if (!tempId) return;

    // Request the temp file from FastAPI
    fetch(`/import/youtube/tempfile?temp_id=${tempId}`)
        .then(r => r.blob())
        .then(blob => {
            const file = new File([blob], "youtube_clip.mp4", { type: "video/mp4" });

            const dt = new DataTransfer();
            dt.items.add(file);

            document.getElementById("file_input").files = dt.files;
        })
        .catch(err => console.error("YT temp load error:", err));
});
</script>
{% endif %}

{% endblock %}
